name: Real Kimi GGUF Q8_0 Vietnamese final gate

on:
  push:
    branches:
      - research/kimi-vl-gguf-q8-import
    paths:
      - '.github/workflows/kimi-gguf-q8-real-vi-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vi-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
      OFFICIAL_REPO: moonshotai/Kimi-VL-A3B-Instruct
      OFFICIAL_REVISION: 398eede0903cd983a2bfa0cc634e9ac1d843f375
      GGUF_REPO: mradermacher/Kimi-VL-A3B-Instruct-GGUF
      GGUF_REVISION: d645665be0a3028dca3ef3d08dddb51ab23ecf31
      GGUF_FILE: Kimi-VL-A3B-Instruct.Q8_0.gguf
      GGUF_BYTES: '16974941728'
      LLAMA_CPP_GGUF_COMMIT: 5d4a3be26de60093263b2d41ca24c3a49de95cd5
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir huggingface_hub hf_xet safetensors numpy tiktoken transformers jinja2 requests
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "git+https://github.com/ggml-org/llama.cpp.git@${LLAMA_CPP_GGUF_COMMIT}#subdirectory=gguf-py"
      - name: Build direct-GGUF generator
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target kvl_generate_gguf_q8 -j2
      - name: Fetch pinned tokenizer and pack BF16 trunk only
        shell: bash
        run: |
          set -euo pipefail
          packed="$RUNNER_TEMP/kimi-gguf-q8-runtime"
          work="$RUNNER_TEMP/kimi-official-trunk-source"
          python tools/fetch_tokenizer.py "$packed" --repo "$OFFICIAL_REPO" --revision "$OFFICIAL_REVISION"
          python tools/pack_full_text.py "$work" "$packed" --repo "$OFFICIAL_REPO" --revision "$OFFICIAL_REVISION" --expert-format none
          test -s "$packed/trunk.bin"
          test ! -e "$packed/experts.bin"
      - name: Download pinned full Q8_0 GGUF and build direct index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          packed = Path(os.environ['RUNNER_TEMP']) / 'kimi-gguf-q8-runtime'
          src = Path(hf_hub_download(repo_id=os.environ['GGUF_REPO'], revision=os.environ['GGUF_REVISION'], filename=os.environ['GGUF_FILE'], local_dir=packed))
          dst = packed / 'experts.bin'
          if src.resolve() != dst.resolve(): src.replace(dst)
          assert dst.stat().st_size == int(os.environ['GGUF_BYTES'])
          PY
          packed="$RUNNER_TEMP/kimi-gguf-q8-runtime"
          evidence="$RUNNER_TEMP/kimi-gguf-q8-vi-final"
          mkdir -p "$evidence"
          python tools/index_kimi_gguf_q8.py "$packed/experts.bin" "$packed/experts.idx" --summary-json "$evidence/index-summary.json"
      - name: Vietnamese arithmetic strict gate
        shell: bash
        run: |
          set -euo pipefail
          packed="$RUNNER_TEMP/kimi-gguf-q8-runtime"
          e="$RUNNER_TEMP/kimi-gguf-q8-vi-final"
          python tools/kvl_chat.py "$packed" 'Tính 125 + 75. Chỉ trả lời bằng số.' \
            --binary ./build/kvl_generate_gguf_q8 --cache-mib 512 --ram-mib 4096 \
            --max-new 8 --temperature 0 --seed 1 --show-tokens \
            > >(tee "$e/vi-arithmetic.out") 2> >(tee "$e/vi-arithmetic.err" >&2)
          grep -q 'expert_direct_io=yes' "$e/vi-arithmetic.err"
          grep -Eq '(^|[^0-9])200([^0-9]|$)' "$e/vi-arithmetic.out"
      - name: Vietnamese knowledge strict gate
        shell: bash
        run: |
          set -euo pipefail
          packed="$RUNNER_TEMP/kimi-gguf-q8-runtime"
          e="$RUNNER_TEMP/kimi-gguf-q8-vi-final"
          python tools/kvl_chat.py "$packed" 'Thủ đô của Việt Nam là thành phố nào? Chỉ trả lời tên thành phố.' \
            --binary ./build/kvl_generate_gguf_q8 --cache-mib 512 --ram-mib 4096 \
            --max-new 10 --temperature 0 --seed 1 --show-tokens \
            > >(tee "$e/vi-capital.out") 2> >(tee "$e/vi-capital.err" >&2)
          grep -q 'expert_direct_io=yes' "$e/vi-capital.err"
          grep -qi 'Hà Nội' "$e/vi-capital.out"
      - name: Summarize strict evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'kimi-gguf-q8-vi-final'
          def t(name):
              p=root/name
              return p.read_text(errors='replace').strip() if p.exists() else None
          out={'vi_arithmetic':t('vi-arithmetic.out'),'vi_capital':t('vi-capital.out')}
          out['vi_arithmetic_pass']=bool(out['vi_arithmetic'] and '200' in out['vi_arithmetic'])
          out['vi_capital_pass']=bool(out['vi_capital'] and 'Hà Nội'.lower() in out['vi_capital'].lower())
          (root/'summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload strict VI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-gguf-q8-real-vi-final-evidence
          path: ${{ runner.temp }}/kimi-gguf-q8-vi-final/**
          retention-days: 14
