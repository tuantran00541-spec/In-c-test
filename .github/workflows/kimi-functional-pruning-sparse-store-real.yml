name: Real Kimi sparse expert-store equivalence

on:
  workflow_dispatch:
  push:
    branches:
      - research/kimi-vl-functional-pruning
    paths:
      - ".github/workflows/kimi-functional-pruning-sparse-store-real.yml"

permissions:
  actions: read
  contents: read

jobs:
  sparse-store-real:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
      KIMI_REV: "398eede0903cd983a2bfa0cc634e9ac1d843f375"
      PHASE_A_MASK: "tests/data/kimi-functional-pruning-phase-a-33259183604-adaptive-unseen-cap6.mask"
      MASK_SHA256: "13ddf32e65c0dad8848fdf4ae299f12b7151a3bcc09145e89a4328c2b241ff6b"
      VL_PHASE_B_RUN_ID: "33287822386"
      VL_PHASE_B_JOB_ID: "99194022081"
      VL_PHASE_B_SOURCE_SHA: "f03d14a801675930c94ebe1f17c45ffb3562a414"
      VL_PHASE_B_ARTIFACT_ID: "9725381834"
      VL_PHASE_B_ARTIFACT_NAME: "kimi-functional-pruning-vl-phase-b-evidence"
      VL_PHASE_B_ARTIFACT_SHA256: "27d4459367fbf5b41675ad35c59963f86bcb69f6ebca28ad3bb89ba79a6b5dd8"
      CACHE_MIB: "512"
      RAM_MIB: "4096"

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy pillow tiktoken transformers jinja2
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build AVX2 runtime and recheck sparse tooling
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x ./build/kvl_probe
          test -x ./build/kvl_generate
          test -x ./build/kvl_generate_vl
          test -x ./build/kvl_vision
          python tests/test_compact_expert_store.py
          python tests/test_verify_compact_expert_store.py
          python tests/test_sparse_expert_store_runtime.py
          python tests/test_kimi_expert_store_equivalence.py

      - name: Verify VL Phase B promotion provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VL_PHASE_B_RUN_ID" > "$RUNNER_TEMP/vl-phase-b-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VL_PHASE_B_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/vl-phase-b-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VL_PHASE_B_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/vl-phase-b-artifacts.json"
          python - <<'PY'
          import hashlib, json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          run = json.loads((temp / 'vl-phase-b-run.json').read_text())
          jobs = json.loads((temp / 'vl-phase-b-jobs.json').read_text())['jobs']
          artifacts = json.loads((temp / 'vl-phase-b-artifacts.json').read_text())['artifacts']
          assert run['id'] == int(os.environ['VL_PHASE_B_RUN_ID'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['VL_PHASE_B_SOURCE_SHA']
          job = next(j for j in jobs if j['id'] == int(os.environ['VL_PHASE_B_JOB_ID']))
          assert job['status'] == 'completed' and job['conclusion'] == 'success'
          steps = {s['name']: s for s in job['steps']}
          assert steps['Run long-generation full vs adaptive VL Phase B']['conclusion'] == 'success'
          assert steps['Evaluate physical-prune eligibility']['conclusion'] == 'success'
          artifact = next(a for a in artifacts if a['id'] == int(os.environ['VL_PHASE_B_ARTIFACT_ID']))
          assert artifact['name'] == os.environ['VL_PHASE_B_ARTIFACT_NAME']
          assert artifact['digest'] == 'sha256:' + os.environ['VL_PHASE_B_ARTIFACT_SHA256']
          assert not artifact['expired']
          mask = pathlib.Path(os.environ['PHASE_A_MASK'])
          assert hashlib.sha256(mask.read_bytes()).hexdigest() == os.environ['MASK_SHA256']
          print(f"SPARSE_PROMOTION_PROVENANCE_PASS run={run['id']} job={job['id']} artifact={artifact['id']}")
          PY

      - name: Restore representative VL image
        run: |
          mkdir -p "$RUNNER_TEMP/vl-images"
          base64 -d .github/testdata/kimi-user-en.jpg.b64 > "$RUNNER_TEMP/vl-images/user-en.jpg"
          test -s "$RUNNER_TEMP/vl-images/user-en.jpg"

      - name: Fetch pinned Kimi source metadata and MoonViT shard
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          repo = 'moonshotai/Kimi-VL-A3B-Instruct'
          rev = os.environ['KIMI_REV']
          root = Path(os.environ['RUNNER_TEMP']) / 'kimi-source'
          root.mkdir(parents=True, exist_ok=True)
          for name in ('config.json', 'model.safetensors.index.json', 'model-00001-of-00007.safetensors'):
              p = hf_hub_download(repo_id=repo, revision=rev, filename=name, local_dir=root)
              print(f"SPARSE_SOURCE {name} -> {p}")
          PY

      - name: Pack pinned MoonViT before text shards are consumed
        run: |
          python tools/pack_vision.py "$RUNNER_TEMP/kimi-source" "$RUNNER_TEMP/packed"
          test -s "$RUNNER_TEMP/packed/vision.bin"
          test -s "$RUNNER_TEMP/packed/vision.idx"

      - name: Pack official Kimi text with full Q8 routed expert store
        run: |
          python tools/fetch_tokenizer.py "$RUNNER_TEMP/packed" --revision "$KIMI_REV"
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-source" "$RUNNER_TEMP/packed" \
            --revision "$KIMI_REV" --expert-format q8
          test -s "$RUNNER_TEMP/packed/trunk.bin"
          test -s "$RUNNER_TEMP/packed/trunk.idx"
          test -s "$RUNNER_TEMP/packed/experts.bin"
          test -s "$RUNNER_TEMP/packed/experts.idx"
          df -h "$RUNNER_TEMP"

      - name: Compact real Q8 expert store and verify retained bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparse" "$RUNNER_TEMP/evidence"
          python tools/compact_expert_store.py \
            "$RUNNER_TEMP/packed/experts.bin" "$RUNNER_TEMP/packed/experts.idx" \
            "$PHASE_A_MASK" \
            "$RUNNER_TEMP/sparse/experts.bin" "$RUNNER_TEMP/sparse/experts.idx" \
            --report "$RUNNER_TEMP/evidence/compaction.json"
          test -s "$RUNNER_TEMP/sparse/experts.mask"
          cp "$RUNNER_TEMP/sparse/experts.mask" "$RUNNER_TEMP/evidence/bound-experts.mask"
          python tools/verify_compact_expert_store.py \
            "$RUNNER_TEMP/packed/experts.bin" "$RUNNER_TEMP/packed/experts.idx" \
            "$RUNNER_TEMP/sparse/experts.bin" "$RUNNER_TEMP/sparse/experts.idx" \
            "$PHASE_A_MASK" --report "$RUNNER_TEMP/evidence/byte-verification.json"
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from compact_expert_store import read_mask
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          root = temp / 'evidence'
          c = json.loads((root / 'compaction.json').read_text())
          v = json.loads((root / 'byte-verification.json').read_text())
          source_mask = read_mask(pathlib.Path(os.environ['PHASE_A_MASK']))
          bound_mask = read_mask(temp / 'sparse' / 'experts.mask')
          assert source_mask == bound_mask and len(bound_mask) == 50
          assert c['source_records'] == 1664 and c['output_records'] == 1614
          assert c['disabled_mask_entries'] == 50 and c['removed_records'] == 50
          assert c['mask_sidecar_entries'] == 50
          assert pathlib.Path(c['mask_sidecar']) == temp / 'sparse' / 'experts.mask'
          assert c['disabled_missing_from_source'] == 0
          assert v['source_records'] == 1664 and v['sparse_records'] == 1614
          assert v['disabled_records'] == 50 and v['records_verified'] == 1614
          assert v['byte_exact'] is True
          assert c['source_bytes'] == v['source_bytes']
          assert c['output_bytes'] == v['sparse_bytes']
          assert c['byte_reduction'] == v['byte_reduction']
          print(
              'REAL_SPARSE_BYTE_GATE_PASS '
              f"records={c['source_records']}->{c['output_records']} "
              f"bytes={c['source_bytes']}->{c['output_bytes']} reduction={c['byte_reduction_fraction']:.9f} "
              f"bound_mask_entries={len(bound_mask)}"
          )
          PY

      - name: Exercise C sparse-store auto-binding for all removed IDs
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools')
          from compact_expert_store import read_index, read_mask
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          sparse_bin = temp / 'sparse' / 'experts.bin'
          sparse_idx = temp / 'sparse' / 'experts.idx'
          disabled = sorted(read_mask(pathlib.Path(os.environ['PHASE_A_MASK'])))
          meta = read_index(sparse_idx)
          assert len(disabled) == 50
          assert all(key not in meta['ids'] for key in disabled)
          env = os.environ.copy()
          env.pop('KVL_MOE_MASK', None)
          probe = pathlib.Path('build/kvl_probe').resolve()
          binding_seen = 0
          for layer, expert in disabled:
              p = subprocess.run(
                  [str(probe), str(sparse_bin), str(sparse_idx), str(layer), str(expert)],
                  text=True, capture_output=True, env=env,
              )
              assert p.returncode == 1, (layer, expert, p.stdout, p.stderr)
              assert 'sparse expert store bound mask=' in p.stderr
              assert f'expert L{layer}/E{expert} not present' in p.stderr
              binding_seen += 1
          retained = min(meta['ids'])
          p = subprocess.run(
              [str(probe), str(sparse_bin), str(sparse_idx), str(retained[0]), str(retained[1])],
              text=True, capture_output=True, env=env,
          )
          assert p.returncode == 0, (retained, p.stdout, p.stderr)
          assert 'sparse expert store bound mask=' in p.stderr
          report = {
              'removed_ids_checked': len(disabled),
              'all_removed_absent_via_c_runtime': True,
              'auto_mask_env_unset': True,
              'auto_binding_messages_checked': binding_seen + 1,
              'retained_id_checked': list(retained),
              'retained_load_ok_via_c_runtime': True,
          }
          out = temp / 'evidence' / 'c-sparse-lookup.json'
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(
              f"REAL_SPARSE_C_AUTO_BIND_PASS removed={len(disabled)} retained={retained} "
              f"bindings={binding_seen + 1}"
          )
          PY

      - name: Prepare representative text and VL inputs under RAM cap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from kimi_image import write_patches
          from kimi_tokenizer import build_encoding, encode_chat, encode_image_chat
          from kvl_memory_plan import MIB, as_mib, planned_text_breakdown
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          model = temp / 'packed'
          prep = temp / 'equivalence-inputs'
          prep.mkdir(parents=True, exist_ok=True)
          enc, _, _ = build_encoding(model)
          text_suite = json.loads(pathlib.Path('tests/data/kimi-functional-pruning-suite.json').read_text())
          text_case = next(x for x in text_suite['heldout'] if x['id'] == 'eval-arithmetic-01')
          text_ids = encode_chat(enc, text_case['prompt'], 'You are a helpful assistant')
          (prep / 'text.ids').write_text('\n'.join(map(str, text_ids)) + '\n', encoding='ascii')
          vl_suite = json.loads(pathlib.Path('tests/data/kimi-functional-pruning-vl-suite.json').read_text())
          vl_case = next(x for x in vl_suite['cases'] if x['id'] == 'vl-user-en-description')
          gh, gw = write_patches(model, temp / 'vl-images' / vl_case['image'], prep / 'patches.f32')
          media_tokens = (gh // 2) * (gw // 2)
          vl_ids = encode_image_chat(enc, vl_case['prompt'], media_tokens, 'You are a helpful assistant')
          (prep / 'vl.ids').write_text('\n'.join(map(str, vl_ids)) + '\n', encoding='ascii')
          cache = int(os.environ['CACHE_MIB'])
          ram = int(os.environ['RAM_MIB']) * MIB
          text_plan = planned_text_breakdown(len(text_ids), 8, cache)
          vl_plan = planned_text_breakdown(len(vl_ids), 8, cache)
          assert text_plan['total'] <= ram and vl_plan['total'] <= ram
          info = {
              'text_case': text_case['id'], 'text_prompt_tokens': len(text_ids),
              'text_planned_mib': as_mib(text_plan['total']),
              'vl_case': vl_case['id'], 'vl_prompt_tokens': len(vl_ids),
              'vl_media_tokens': media_tokens, 'vl_grid': [gh, gw],
              'vl_planned_mib': as_mib(vl_plan['total']),
              'cache_mib': cache, 'ram_cap_mib': int(os.environ['RAM_MIB']), 'max_new': 8,
          }
          (temp / 'evidence' / 'equivalence-inputs.json').write_text(
              json.dumps(info, indent=2, sort_keys=True) + '\n'
          )
          print(
              'REAL_SPARSE_INPUTS_READY '
              f"text_tokens={len(text_ids)} vl_tokens={len(vl_ids)} "
              f"text_plan={info['text_planned_mib']:.1f}MiB vl_plan={info['vl_planned_mib']:.1f}MiB"
          )
          PY
          read GH GW < <(python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence' / 'equivalence-inputs.json'
          print(*json.loads(p.read_text())['vl_grid'])
          PY
          )
          ./build/kvl_vision \
            "$RUNNER_TEMP/packed/vision.bin" "$RUNNER_TEMP/packed/vision.idx" \
            "$RUNNER_TEMP/equivalence-inputs/patches.f32" "$GH" "$GW" \
            "$RUNNER_TEMP/equivalence-inputs/media.f32"
          test -s "$RUNNER_TEMP/equivalence-inputs/media.f32"

      - name: Compare full explicit mask vs sparse auto-bound sidecar on text
        run: |
          python tools/run_kimi_expert_store_equivalence.py \
            --binary ./build/kvl_generate \
            --trunk-bin "$RUNNER_TEMP/packed/trunk.bin" --trunk-idx "$RUNNER_TEMP/packed/trunk.idx" \
            --full-experts-bin "$RUNNER_TEMP/packed/experts.bin" --full-experts-idx "$RUNNER_TEMP/packed/experts.idx" \
            --sparse-experts-bin "$RUNNER_TEMP/sparse/experts.bin" --sparse-experts-idx "$RUNNER_TEMP/sparse/experts.idx" \
            --prompt-ids "$RUNNER_TEMP/equivalence-inputs/text.ids" --mask "$PHASE_A_MASK" \
            --sparse-auto-mask --work-dir "$RUNNER_TEMP/eq-text" \
            --cache-mib "$CACHE_MIB" --max-new 8 --temperature 0 --seed 1
          cp "$RUNNER_TEMP/eq-text/expert-store-equivalence.json" "$RUNNER_TEMP/evidence/text-runtime-equivalence.json"

      - name: Compare full explicit mask vs sparse auto-bound sidecar on VL
        run: |
          python tools/run_kimi_expert_store_equivalence.py \
            --binary ./build/kvl_generate_vl \
            --trunk-bin "$RUNNER_TEMP/packed/trunk.bin" --trunk-idx "$RUNNER_TEMP/packed/trunk.idx" \
            --full-experts-bin "$RUNNER_TEMP/packed/experts.bin" --full-experts-idx "$RUNNER_TEMP/packed/experts.idx" \
            --sparse-experts-bin "$RUNNER_TEMP/sparse/experts.bin" --sparse-experts-idx "$RUNNER_TEMP/sparse/experts.idx" \
            --prompt-ids "$RUNNER_TEMP/equivalence-inputs/vl.ids" \
            --media "$RUNNER_TEMP/equivalence-inputs/media.f32" --mask "$PHASE_A_MASK" \
            --sparse-auto-mask --work-dir "$RUNNER_TEMP/eq-vl" \
            --cache-mib "$CACHE_MIB" --max-new 8 --temperature 0 --seed 1
          cp "$RUNNER_TEMP/eq-vl/expert-store-equivalence.json" "$RUNNER_TEMP/evidence/vl-runtime-equivalence.json"

      - name: Write measured physical sparse-store summary
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python - <<'PY'
          import hashlib, json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          evidence = temp / 'evidence'
          def load(name):
              p = evidence / name
              return json.loads(p.read_text()) if p.is_file() else None
          comp = load('compaction.json')
          verify = load('byte-verification.json')
          lookup = load('c-sparse-lookup.json')
          text_eq = load('text-runtime-equivalence.json')
          vl_eq = load('vl-runtime-equivalence.json')
          mask = pathlib.Path(os.environ['PHASE_A_MASK'])
          bound = evidence / 'bound-experts.mask'
          payload = {
              'schema_version': 2,
              'scope': 'real physical Q8 sparse expert-store auto-bound layout equivalence; not a global quality or speed claim',
              'workflow_head_sha': os.environ['GITHUB_SHA'],
              'kvl_model_revision': os.environ['KIMI_REV'],
              'source_vl_phase_b_run_id': int(os.environ['VL_PHASE_B_RUN_ID']),
              'source_vl_phase_b_artifact_id': int(os.environ['VL_PHASE_B_ARTIFACT_ID']),
              'mask_sha256': hashlib.sha256(mask.read_bytes()).hexdigest(),
              'bound_mask_sha256': hashlib.sha256(bound.read_bytes()).hexdigest() if bound.is_file() else None,
              'cache_mib': int(os.environ['CACHE_MIB']), 'ram_cap_mib': int(os.environ['RAM_MIB']),
              'compaction': comp, 'byte_verification': verify, 'c_sparse_lookup': lookup,
              'text_runtime_equivalence': text_eq, 'vl_runtime_equivalence': vl_eq,
          }
          payload['eligible_for_packaging_safety_work'] = bool(
              comp and verify and lookup and text_eq and vl_eq and bound.is_file()
              and comp.get('source_records') == 1664 and comp.get('output_records') == 1614
              and comp.get('removed_records') == 50 and comp.get('mask_sidecar_entries') == 50
              and verify.get('byte_exact') is True and verify.get('records_verified') == 1614
              and lookup.get('all_removed_absent_via_c_runtime') is True
              and lookup.get('auto_mask_env_unset') is True
              and text_eq.get('byte_exact') is True and vl_eq.get('byte_exact') is True
              and text_eq.get('sparse_auto_mask') is True and vl_eq.get('sparse_auto_mask') is True
              and text_eq.get('sparse', {}).get('mask_mode') == 'sparse-sidecar-auto'
              and vl_eq.get('sparse', {}).get('mask_mode') == 'sparse-sidecar-auto'
          )
          out = evidence / 'physical-sparse-summary.json'
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'eligible_for_packaging_safety_work': payload['eligible_for_packaging_safety_work'],
              'source_bytes': comp.get('source_bytes') if comp else None,
              'sparse_bytes': comp.get('output_bytes') if comp else None,
              'byte_reduction': comp.get('byte_reduction') if comp else None,
              'byte_reduction_fraction': comp.get('byte_reduction_fraction') if comp else None,
              'bound_mask_sha256': payload['bound_mask_sha256'],
              'text_runtime_byte_exact': text_eq.get('byte_exact') if text_eq else None,
              'vl_runtime_byte_exact': vl_eq.get('byte_exact') if vl_eq else None,
              'text_sparse_auto_mask': text_eq.get('sparse_auto_mask') if text_eq else None,
              'vl_sparse_auto_mask': vl_eq.get('sparse_auto_mask') if vl_eq else None,
          }, sort_keys=True))
          PY

      - name: Gate physical sparse-store auto-binding equivalence
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence' / 'physical-sparse-summary.json'
          r = json.loads(p.read_text())
          if not r['eligible_for_packaging_safety_work']:
              print('REAL_SPARSE_AUTO_BIND_EQUIVALENCE_REJECT')
              sys.exit(1)
          c = r['compaction']
          print(
              'REAL_SPARSE_AUTO_BIND_EQUIVALENCE_PASS '
              f"records={c['source_records']}->{c['output_records']} "
              f"bytes={c['source_bytes']}->{c['output_bytes']} "
              f"reduction_bytes={c['byte_reduction']} reduction_fraction={c['byte_reduction_fraction']:.9f} "
              f"bound_mask_sha256={r['bound_mask_sha256']}"
          )
          print('NOTE: sparse sidecar auto-binding preserved the tested same-mask text/VL computation; global quality and speed are not proven.')
          PY

      - name: Upload sparse-store evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-functional-pruning-sparse-store-evidence
          path: |
            ${{ runner.temp }}/evidence/**
          if-no-files-found: warn
