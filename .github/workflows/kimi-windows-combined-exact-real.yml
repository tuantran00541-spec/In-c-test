name: Real Kimi packed Q8 Windows combined-exact

on:
  push:
    branches:
      - research/kimi-msvc-q8-openmp-bench
    paths:
      - '.github/workflows/kimi-windows-combined-exact-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-real-combined:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      OFFICIAL_REPO: moonshotai/Kimi-VL-A3B-Instruct
      OFFICIAL_REVISION: 398eede0903cd983a2bfa0cc634e9ac1d843f375
      OMP_DYNAMIC: 'FALSE'
      OMP_NESTED: 'FALSE'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned runtime pack dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --no-cache-dir huggingface_hub hf_xet safetensors numpy tiktoken transformers jinja2 requests

      - name: Build isolated Windows performance research binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\windows_build_perf_research.ps1
          if (-not (Test-Path '.\build-perf-research\core\Release\kvl_generate.exe')) { throw 'baseline binary missing' }
          if (-not (Test-Path '.\build-perf-research\Release\kvl_generate_combined_exact.exe')) { throw 'combined exact binary missing' }

      - name: Pack pinned official text runtime as routed Q8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = Join-Path $env:RUNNER_TEMP 'kimi-official-q8-source'
          $packed = Join-Path $env:RUNNER_TEMP 'kimi-packed-q8-runtime'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          New-Item -ItemType Directory -Force -Path $packed | Out-Null

          python .\tools\fetch_tokenizer.py $packed --repo $env:OFFICIAL_REPO --revision $env:OFFICIAL_REVISION
          python .\tools\pack_full_text.py $work $packed `
            --repo $env:OFFICIAL_REPO `
            --revision $env:OFFICIAL_REVISION `
            --expert-format q8

          foreach ($name in @('trunk.bin','trunk.idx','experts.bin','experts.idx','tiktoken.model')) {
            $p = Join-Path $packed $name
            if (-not (Test-Path $p)) { throw "packed runtime missing $name" }
          }
          Get-Item (Join-Path $packed 'trunk.bin'), (Join-Path $packed 'experts.bin') |
            Select-Object Name,Length | Format-Table -AutoSize
          Get-PSDrive -PSProvider FileSystem

      - name: Real full-model exact gate then long combined run
        shell: pwsh
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packed = Join-Path $env:RUNNER_TEMP 'kimi-packed-q8-runtime'
          $python = (Get-Command python).Source

          # This script first runs one real baseline plus combined-exact at 2/4/6 threads.
          # It compares generated token IDs and refuses to start the expensive long run on
          # any mismatch. Only after the exact gate passes does it select the fastest short
          # arm and run the same saved 306-token / max_new=1024 prompt used on the Dell.
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\windows_long_prompt_combined.ps1 `
            -ModelDir $packed `
            -Python $python `
            -BaselineBinary '.\build-perf-research\core\Release\kvl_generate.exe' `
            -CandidateBinary '.\build-perf-research\Release\kvl_generate_combined_exact.exe' `
            -ThreadList '2,4,6'
          if ($LASTEXITCODE -ne 0) { throw "real combined-exact gate/run failed: exit=$LASTEXITCODE" }

      - name: Verify repository remained clean
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code
