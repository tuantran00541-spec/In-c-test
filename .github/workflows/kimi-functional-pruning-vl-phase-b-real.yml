name: Real Kimi-VL functional pruning phase B

on:
  workflow_dispatch:
  push:
    branches:
      - research/kimi-vl-functional-pruning
    paths:
      - ".github/workflows/kimi-functional-pruning-vl-phase-b-real.yml"

permissions:
  contents: read

jobs:
  vl-phase-b:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
      KIMI_REV: "398eede0903cd983a2bfa0cc634e9ac1d843f375"
      PHASE_A_RUN_ID: "33259183604"
      PHASE_A_MASK: "tests/data/kimi-functional-pruning-phase-a-33259183604-adaptive-unseen-cap6.mask"
      VL_GUARD_RUN_ID: "33286213813"
      VL_GUARD_MANIFEST: "tests/data/kimi-functional-pruning-vl-guard-33286213813.json"
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy pillow tiktoken transformers jinja2
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build AVX2 multimodal runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x ./build/kvl_vision
          test -x ./build/kvl_generate_vl
          python tools/run_kimi_pruning_vl_phase_b.py --validate-only

      - name: Verify VL guard promotion provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          mask = pathlib.Path(os.environ['PHASE_A_MASK'])
          g = json.loads(pathlib.Path(os.environ['VL_GUARD_MANIFEST']).read_text())
          digest = hashlib.sha256(mask.read_bytes()).hexdigest()
          assert g['source_workflow_run_id'] == int(os.environ['VL_GUARD_RUN_ID'])
          assert g['candidate'] == 'adaptive-unseen-cap6'
          assert g['kvl_model_revision'] == os.environ['KIMI_REV']
          assert g['phase_a_source_workflow_run_id'] == int(os.environ['PHASE_A_RUN_ID'])
          assert g['mask_sha256'] == digest
          assert g['cases'] == 4
          assert g['first_token_exact'] == 4
          assert g['logit_argmax_agree'] == 4
          assert g['logit_min_top10_overlap'] >= 0.8
          assert g['logit_max_js_divergence'] <= 0.01
          assert g['unique_masked_slots_hit'] == 50
          assert g['media_unique_masked_slots_hit'] == 50
          assert g['artifact']['id'] == 9724746706
          assert g['artifact']['sha256'] == 'cd99c05f4ddc22178f1a422db2fc67784ee6752c3440c82daf5447cf8a25065f'
          print(
              f"VL_PHASE_B_PROVENANCE_PASS guard={g['source_workflow_run_id']} "
              f"media_hits={g['media_direct_masked_selections']} max_js={g['logit_max_js_divergence']} "
              f"mask_sha256={digest}"
          )
          PY

      - name: Restore and generate VL Phase B images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vl-images"
          base64 -d .github/testdata/kimi-user-vi.jpg.b64 > "$RUNNER_TEMP/vl-images/user-vi.jpg"
          base64 -d .github/testdata/kimi-user-en.jpg.b64 > "$RUNNER_TEMP/vl-images/user-en.jpg"
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path(os.environ['RUNNER_TEMP']) / 'vl-images'

          im = Image.new('RGB', (448, 448), 'white')
          d = ImageDraw.Draw(im)
          d.rectangle((40, 55, 190, 205), fill='red')
          d.ellipse((245, 55, 395, 205), fill='blue')
          d.polygon([(220, 245), (105, 405), (335, 405)], fill='green')
          im.save(root / 'synthetic-shapes.png')

          im = Image.new('RGB', (448, 448), 'white')
          d = ImageDraw.Draw(im)
          cell = 56
          for y in range(8):
              for x in range(8):
                  if (x + y) % 2:
                      d.rectangle(
                          (x * cell, y * cell, (x + 1) * cell - 1, (y + 1) * cell - 1),
                          fill='black',
                      )
          im.save(root / 'synthetic-checker.png')

          for p in sorted(root.iterdir()):
              with Image.open(p) as img:
                  print(f"VL_PHASE_B_IMAGE {p.name} size={img.size} mode={img.mode}")
          PY

      - name: Fetch pinned MoonViT source metadata
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          repo = 'moonshotai/Kimi-VL-A3B-Instruct'
          rev = os.environ['KIMI_REV']
          root = Path(os.environ['RUNNER_TEMP']) / 'kimi-source'
          root.mkdir(parents=True, exist_ok=True)
          for name in ('config.json', 'model.safetensors.index.json', 'model-00001-of-00007.safetensors'):
              p = hf_hub_download(repo_id=repo, revision=rev, filename=name, local_dir=root)
              print(f"VL_PHASE_B_SOURCE {name} -> {p}")
          PY

      - name: Pack pinned MoonViT before text shards are consumed
        run: |
          python tools/pack_vision.py "$RUNNER_TEMP/kimi-source" "$RUNNER_TEMP/packed-vl"
          test -s "$RUNNER_TEMP/packed-vl/vision.bin"
          test -s "$RUNNER_TEMP/packed-vl/vision.idx"
          du -h "$RUNNER_TEMP/packed-vl/vision.bin"

      - name: Pack official Kimi text with Q8 routed experts
        run: |
          python tools/fetch_tokenizer.py "$RUNNER_TEMP/packed-vl" --revision "$KIMI_REV"
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-source" "$RUNNER_TEMP/packed-vl" \
            --revision "$KIMI_REV" --expert-format q8
          test -s "$RUNNER_TEMP/packed-vl/trunk.bin"
          test -s "$RUNNER_TEMP/packed-vl/experts.bin"
          du -h "$RUNNER_TEMP/packed-vl"/*.bin
          df -h "$RUNNER_TEMP"

      - name: Write VL Phase B provenance evidence
        run: |
          mkdir -p "$RUNNER_TEMP/vl-phase-b"
          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vl-phase-b' / 'provenance.json'
          payload = {
              'schema_version': 1,
              'workflow_head_sha': os.environ['GITHUB_SHA'],
              'kvl_model_revision': os.environ['KIMI_REV'],
              'phase_a_run_id': int(os.environ['PHASE_A_RUN_ID']),
              'vl_guard_run_id': int(os.environ['VL_GUARD_RUN_ID']),
              'mask_path': os.environ['PHASE_A_MASK'],
              'vl_guard_manifest': os.environ['VL_GUARD_MANIFEST'],
              'cache_mib': 512,
              'ram_mib': 4096,
              'scope': 'long-generation deterministic multimodal A/B regression',
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(out.read_text())
          PY

      - name: Run long-generation full vs adaptive VL Phase B
        run: |
          python tools/run_kimi_pruning_vl_phase_b.py \
            --model-dir "$RUNNER_TEMP/packed-vl" \
            --image-root "$RUNNER_TEMP/vl-images" \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --mask "$PHASE_A_MASK" \
            --work-dir "$RUNNER_TEMP/vl-phase-b" \
            --cache-mib 512 --ram-mib 4096

      - name: Print VL Phase B summary
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/vl-phase-b/vl-phase-b-summary.json"; then
            python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vl-phase-b' / 'vl-phase-b-summary.json'
          r = json.loads(p.read_text())
          a = r['aggregate']
          print(
              f"VL_PHASE_B_AGG exact={a['token_exact_cases']}/{a['cases']} "
              f"full_tokens={a['full_generated_tokens_total']} candidate_tokens={a['candidate_generated_tokens_total']}"
          )
          print(
              f"VL_PHASE_B_IO full_reads={a['full_cache_read_ops_total']} candidate_reads={a['candidate_cache_read_ops_total']} "
              f"full_mib={a['full_cache_bytes_read_mib_total']:.2f} candidate_mib={a['candidate_cache_bytes_read_mib_total']:.2f}"
          )
          print(
              f"VL_PHASE_B_TIME full_text={a['full_text_total_seconds']:.3f} candidate_text={a['candidate_text_total_seconds']:.3f} "
              f"full_vision={a['full_vision_total_seconds']:.3f} candidate_vision={a['candidate_vision_total_seconds']:.3f}"
          )
          for row in r['cases']:
              c = row['comparison']
              print(
                  f"VL_PHASE_B_CASE id={row['id']} max_new={row['max_new']} "
                  f"exact={c['token_exact']} first_div={c['first_divergence_position']} "
                  f"full_tokens={len(row['full']['generated_ids'])} candidate_tokens={len(row['candidate']['generated_ids'])}"
              )
          PY
          else
            echo "vl-phase-b-summary.json not available"
          fi

      - name: Evaluate physical-prune eligibility
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vl-phase-b' / 'vl-phase-b-summary.json'
          r = json.loads(p.read_text())
          a = r['aggregate']
          if a['token_exact_cases'] != a['cases']:
              print(
                  f"VL_PHASE_B_PROMOTION_REJECT exact={a['token_exact_cases']}/{a['cases']} "
                  f"divergent={a['divergent_cases']}"
              )
              sys.exit(1)
          print(
              f"VL_PHASE_B_PROMOTION_ELIGIBLE exact={a['token_exact_cases']}/{a['cases']} "
              f"tokens={a['candidate_generated_tokens_total']}"
          )
          print('NOTE: eligible only for physical sparse-store equivalence experiment; global quality is not proven.')
          PY

      - name: Upload VL Phase B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-functional-pruning-vl-phase-b-evidence
          path: |
            ${{ runner.temp }}/vl-phase-b/**
          if-no-files-found: warn
