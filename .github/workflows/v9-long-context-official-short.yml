name: V9 long-context official short gate

on:
  workflow_dispatch:
  push:
    branches:
      - research/v9-long-context
      - research/v9-two-turn-vi-chat
    paths:
      - ".github/workflows/v9-long-context-official-short.yml"
      - "CMakeLists.txt"
      - "include/kvl/ops.h"
      - "include/kvl/mla_compressed_state.h"
      - "include/kvl/mla_compressed_q8_state.h"
      - "src/ops.c"
      - "src/mla_prefill_streaming.c"
      - "src/mla_streaming_probe.c"
      - "src/mla_compressed_state.c"
      - "src/mla_compressed_q8_state.c"
      - "src/generate.c"
      - "src/generate_vl.c"
      - "src/exact_block_verify.c"
      - "src/self_spec_sweep.c"
      - "tools/kvl_vl_chat.py"
      - "tools/kimi_tokenizer.py"

jobs:
  q8-short-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REPO: moonshotai/Kimi-VL-A3B-Instruct
      REV: 398eede0903cd983a2bfa0cc634e9ac1d843f375
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy pillow tiktoken
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build AVX2 and rerun streaming oracle
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x build/kvl_generate_vl
          test -x build/kvl_exact_block_verify
          test -x build/kvl_self_spec_sweep
          test -x build/kvl_vision
          ./build/kvl_mla_streaming_probe
          ./build/kvl_spec_q8_lab_probe
          python tests/test_q8_matvec.py --build-dir build
      - name: Restore exact V9 acceptance images
        run: |
          base64 -d .github/testdata/kimi-user-en.jpg.b64 > "$RUNNER_TEMP/user-en.jpg"
          base64 -d .github/testdata/kimi-user-vi.jpg.b64 > "$RUNNER_TEMP/user-vi.jpg"
      - name: Fetch pinned frontend and initial vision shard
        run: |
          python - <<'PY'
          import os, shutil
          from huggingface_hub import hf_hub_download
          repo=os.environ['REPO']; rev=os.environ['REV']
          root=os.path.join(os.environ['RUNNER_TEMP'],'model')
          out=os.path.join(os.environ['RUNNER_TEMP'],'q8-runtime')
          os.makedirs(root,exist_ok=True); os.makedirs(out,exist_ok=True)
          for n in ('config.json','model.safetensors.index.json','model-00001-of-00007.safetensors'):
              hf_hub_download(repo,revision=rev,filename=n,local_dir=root)
          for n in ('tiktoken.model','tokenizer_config.json','generation_config.json','chat_template.jinja','preprocessor_config.json'):
              p=hf_hub_download(repo,revision=rev,filename=n,local_dir=root)
              shutil.copy2(p,os.path.join(out,n))
          PY
      - name: Pack pinned BF16 vision plus Q8 routed text
        run: |
          python tools/pack_vision.py "$RUNNER_TEMP/model" "$RUNNER_TEMP/q8-runtime"
          python tools/pack_full_text.py "$RUNNER_TEMP/model" "$RUNNER_TEMP/q8-runtime" --revision "$REV" --expert-format q8
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'q8-runtime'/'experts.bin'
          gib=p.stat().st_size/1024**3
          print('Q8_EXPERT_GIB=',gib)
          assert gib < 14.0
          PY
      - name: Exact four-token target block verifier on official weights
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from kimi_tokenizer import build_encoding, encode_chat
          model=Path(os.environ['RUNNER_TEMP'])/'q8-runtime'
          enc,_,_=build_encoding(model)
          ids=encode_chat(
              enc,
              '2 + 2 bằng bao nhiêu? Trả lời bằng tiếng Việt thật ngắn gọn.',
              'Bạn là một trợ lý hữu ích. Luôn trả lời bằng tiếng Việt.'
          )
          p=Path(os.environ['RUNNER_TEMP'])/'verify-prompt.ids'
          p.write_text('\n'.join(map(str,ids))+'\n',encoding='ascii')
          print('VERIFY_PROMPT_TOKENS=',len(ids))
          PY
          ./build/kvl_exact_block_verify \
            "$RUNNER_TEMP/q8-runtime/trunk.bin" "$RUNNER_TEMP/q8-runtime/trunk.idx" \
            "$RUNNER_TEMP/q8-runtime/experts.bin" "$RUNNER_TEMP/q8-runtime/experts.idx" \
            "$RUNNER_TEMP/verify-prompt.ids" $((512*1024*1024)) 4 \
            | tee "$RUNNER_TEMP/exact-block-output.txt"
          grep -q 'PASS: full-model exact block verifier matches serial target' "$RUNNER_TEMP/exact-block-output.txt"
          grep -q 'logits_max=0 state_max=0' "$RUNNER_TEMP/exact-block-output.txt"
          grep -q 'FULL_BLOCK_ROLLBACK accepted=3 state_max=0' "$RUNNER_TEMP/exact-block-output.txt"
      - name: Self-spec INT8 MLA routed-expert sweep on official weights
        run: |
          ./build/kvl_self_spec_sweep \
            "$RUNNER_TEMP/q8-runtime/trunk.bin" "$RUNNER_TEMP/q8-runtime/trunk.idx" \
            "$RUNNER_TEMP/q8-runtime/experts.bin" "$RUNNER_TEMP/q8-runtime/experts.idx" \
            "$RUNNER_TEMP/verify-prompt.ids" $((512*1024*1024)) 4 \
            | tee "$RUNNER_TEMP/self-spec-output.txt"
          grep -q 'PASS: self-spec target correction/bonus commits remain exact' "$RUNNER_TEMP/self-spec-output.txt"
          grep -q 'SELF_SPEC mask=q8_only' "$RUNNER_TEMP/self-spec-output.txt"
          grep -q 'SELF_SPEC mask=skip4' "$RUNNER_TEMP/self-spec-output.txt"
          grep -q 'SELF_SPEC mask=skip7' "$RUNNER_TEMP/self-spec-output.txt"
          grep -q 'SELF_SPEC mask=skip13' "$RUNNER_TEMP/self-spec-output.txt"
          test "$(grep -c 'seq_ok=yes commit_state_max=0' "$RUNNER_TEMP/self-spec-output.txt")" -eq 4
      - name: Generate exact English accepted case
        run: |
          python tools/kvl_vl_chat.py "$RUNNER_TEMP/q8-runtime" "$RUNNER_TEMP/user-en.jpg" \
            "Look at this image and answer only in English. Describe the character and facial expression in one short sentence." \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --cache-mib 512 --ram-mib 4096 --max-new 16 --temperature 0 --seed 1 \
            --show-tokens \
            2> >(tee "$RUNNER_TEMP/q8-en-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/q8-en-output.txt"
          grep -q 'prefill=exact-head-streaming' "$RUNNER_TEMP/q8-en-stderr.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/q8-en-stderr.txt"
          grep -q 'buffers=3' "$RUNNER_TEMP/q8-en-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/q8-en-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/q8-en-stderr.txt"
      - name: Assert exact English token parity
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          err=(Path(os.environ['RUNNER_TEMP'])/'q8-en-stderr.txt').read_text(errors='replace')
          out=(Path(os.environ['RUNNER_TEMP'])/'q8-en-output.txt').read_text(errors='replace').strip()
          m=re.search(r'generated ids:\s*([0-9 ]+)',err); assert m
          ids=[int(x) for x in m.group(1).split()]
          expected=[1008,6162,924,4393,11,98717,11002,316,261,21478,528,54275,37632,11276,13,163586]
          print('EN_STREAMING_IDS=',ids)
          print('EN_EXACT_ACCEPTED_MATCH=',ids==expected)
          print('EN_OUTPUT=',repr(out))
          assert ids==expected
          assert out == 'The character has large, expressive eyes and a surprised or shocked facial expression.'
          PY
      - name: Generate exact Vietnamese preservation case
        run: |
          python tools/kvl_vl_chat.py "$RUNNER_TEMP/q8-runtime" "$RUNNER_TEMP/user-vi.jpg" \
            "Hãy nhìn ảnh này và trả lời hoàn toàn bằng tiếng Việt. Mô tả ngắn gọn nhân vật và biểu cảm trong ảnh trong một câu." \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --cache-mib 512 --ram-mib 4096 --max-new 16 --temperature 0 --seed 1 \
            --show-tokens \
            2> >(tee "$RUNNER_TEMP/q8-vi-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/q8-vi-output.txt"
          grep -q 'prefill=exact-head-streaming' "$RUNNER_TEMP/q8-vi-stderr.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/q8-vi-stderr.txt"
          grep -q 'buffers=3' "$RUNNER_TEMP/q8-vi-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/q8-vi-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/q8-vi-stderr.txt"
      - name: Assert exact Vietnamese BF16-Q8 trajectory preservation
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          err=(Path(os.environ['RUNNER_TEMP'])/'q8-vi-stderr.txt').read_text(errors='replace')
          out=(Path(os.environ['RUNNER_TEMP'])/'q8-vi-output.txt').read_text(errors='replace').strip()
          m=re.search(r'generated ids:\s*([0-9 ]+)',err); assert m
          ids=[int(x) for x in m.group(1).split()]
          expected=[39,150340,13271,118,96,42955,437,16032,104,77,650,47766,64,124397,275,4313]
          print('VI_STREAMING_IDS=',ids)
          print('VI_EXACT_ACCEPTED_MATCH=',ids==expected)
          print('VI_OUTPUT=',repr(out))
          print('NOTE=Vietnamese is a trajectory-preservation gate, not a semantic-quality claim.')
          assert ids==expected
          PY
