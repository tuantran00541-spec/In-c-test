name: V5 runner disk probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v5-runner-disk.yml"

jobs:
  disk:
    runs-on: ubuntu-latest
    steps:
      - name: Disk before cleanup
        run: |
          df -h /
          df -BG / | tail -1
          sudo du -sh /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup 2>/dev/null || true
      - name: Reclaim optional preinstalled SDKs
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
      - name: Disk after cleanup
        run: |
          df -h /
          df -BG / | tail -1
