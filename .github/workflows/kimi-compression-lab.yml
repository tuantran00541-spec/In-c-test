name: Kimi compression lab

on:
  workflow_dispatch:
  push:
    branches:
      - research/kimi-vl-compression-lab
    paths:
      - "CMakeLists.txt"
      - "src/moe_activation_trace.c"
      - "tools/kimi_compression_lab.py"
      - "tools/kimi_expert_reservoir.py"
      - "tools/kimi_moe_act_reservoir.py"
      - "tools/kimi_measure_bf16_expert.py"
      - "tools/kimi_mixed_bit_plan.py"
      - "tools/README_COMPRESSION_LAB.txt"
      - "tests/test_kimi_compression_lab.py"
      - "tests/test_kimi_expert_reservoir.py"
      - "tests/test_kimi_moe_act_reservoir.py"
      - "tests/test_kimi_measure_bf16_expert.py"
      - "tests/test_kimi_mixed_bit_plan.py"
      - "tests/test_kimi_compression_schema.py"
      - "tests/test_kimi_compression_quickstart.py"
      - "tests/data/kimi-compression-lab-schema.json"
      - "tests/data/kimi-compression-lab-example.json"
      - "spec/KIMI_COMPRESSION_LAB.md"
      - ".github/workflows/kimi-compression-lab.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: python -m pip install --no-cache-dir numpy
      - name: Compile Python compression tooling
        run: |
          python -m py_compile \
            tools/kimi_compression_lab.py \
            tools/kimi_expert_reservoir.py \
            tools/kimi_moe_act_reservoir.py \
            tools/kimi_measure_bf16_expert.py \
            tools/kimi_mixed_bit_plan.py \
            tests/test_kimi_compression_lab.py \
            tests/test_kimi_expert_reservoir.py \
            tests/test_kimi_moe_act_reservoir.py \
            tests/test_kimi_measure_bf16_expert.py \
            tests/test_kimi_mixed_bit_plan.py \
            tests/test_kimi_compression_schema.py \
            tests/test_kimi_compression_quickstart.py
      - name: Run compression lab unit tests
        run: |
          python tests/test_kimi_compression_lab.py
          python tests/test_kimi_expert_reservoir.py
          python tests/test_kimi_moe_act_reservoir.py
          python tests/test_kimi_measure_bf16_expert.py
          python tests/test_kimi_mixed_bit_plan.py
          python tests/test_kimi_compression_schema.py
          python tests/test_kimi_compression_quickstart.py
      - name: Build traced generators without model weights
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build --target kvl_generate_trace kvl_generate_vl_trace -j 2
          test -x build/kvl_generate_trace
          test -x build/kvl_generate_vl_trace
