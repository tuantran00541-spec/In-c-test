name: One-shot code comment cleanup

on:
  push:
    branches: [research/v9-two-turn-vi-chat]
    paths:
      - .github/workflows/_temp_comment_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v9-two-turn-vi-chat
          fetch-depth: 0
      - name: Strip explanatory comments
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import io
          import re
          import tokenize
          from pathlib import Path

          c_files = [
              'include/kvl/mla_compressed_q8_state.h',
              'include/kvl/mla_compressed_state.h',
              'src/exact_block_verify.c',
              'src/generate.c',
              'src/generate_vl.c',
              'src/mla_compressed_q8_state.c',
              'src/mla_compressed_state.c',
              'src/mla_prefill_bench.c',
              'src/mla_prefill_streaming.c',
              'src/mla_streaming_probe.c',
              'src/self_spec_sweep.c',
              'src/spec_q8_lab_probe.c',
          ]
          py_files = [
              'tools/fetch_tokenizer.py',
              'tools/kvl_doctor.py',
              'tools/kvl_memory_plan.py',
              'tools/kvl_vl_chat.py',
              'tools/kvl_vl_two_turn.py',
              'tools/prepare_kimi_vl_q8.py',
              'tools/test_long_context_planner.py',
          ]

          def compact_blank_lines(text: str) -> str:
              lines = [line.rstrip() for line in text.splitlines()]
              out = []
              blank = False
              for line in lines:
                  if not line:
                      if blank:
                          continue
                      blank = True
                  else:
                      blank = False
                  out.append(line)
              return '\n'.join(out).strip() + '\n'

          def strip_c_comments(text: str) -> str:
              out = []
              i = 0
              state = 'code'
              quote = ''
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'code':
                      if ch == '"' or ch == "'":
                          quote = ch
                          state = 'string'
                          out.append(ch)
                          i += 1
                      elif ch == '/' and nxt == '/':
                          state = 'line_comment'
                          out.extend((' ', ' '))
                          i += 2
                      elif ch == '/' and nxt == '*':
                          state = 'block_comment'
                          out.extend((' ', ' '))
                          i += 2
                      else:
                          out.append(ch)
                          i += 1
                  elif state == 'string':
                      out.append(ch)
                      if ch == '\\' and i + 1 < len(text):
                          out.append(text[i + 1])
                          i += 2
                      elif ch == quote:
                          state = 'code'
                          i += 1
                      else:
                          i += 1
                  elif state == 'line_comment':
                      if ch == '\n':
                          out.append('\n')
                          state = 'code'
                      else:
                          out.append(' ')
                      i += 1
                  else:
                      if ch == '*' and nxt == '/':
                          out.extend((' ', ' '))
                          state = 'code'
                          i += 2
                      else:
                          out.append('\n' if ch == '\n' else ' ')
                          i += 1
              if state == 'block_comment':
                  raise RuntimeError('unterminated block comment')
              return compact_blank_lines(''.join(out))

          def docstring_ranges(text: str):
              tree = ast.parse(text)
              ranges = []
              nodes = [tree]
              nodes.extend(n for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)))
              for node in nodes:
                  body = getattr(node, 'body', None)
                  if not body:
                      continue
                  first = body[0]
                  if isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant) and isinstance(first.value.value, str):
                      ranges.append((first.lineno, first.end_lineno))
              return ranges

          def strip_python_notes(text: str) -> str:
              ranges = docstring_ranges(text)
              lines = text.splitlines(keepends=True)
              for start, end in ranges:
                  for n in range(start - 1, end):
                      lines[n] = '\n' if lines[n].endswith('\n') else ''
              text = ''.join(lines)
              tokens = []
              for tok in tokenize.generate_tokens(io.StringIO(text).readline):
                  if tok.type == tokenize.COMMENT:
                      if tok.start[0] == 1 and tok.string.startswith('#!'):
                          tokens.append(tok)
                      else:
                          tokens.append(tokenize.TokenInfo(tok.type, '', tok.start, tok.end, tok.line))
                  else:
                      tokens.append(tok)
              return compact_blank_lines(tokenize.untokenize(tokens))

          changed = 0
          for name in c_files:
              p = Path(name)
              before = p.read_text(encoding='utf-8')
              after = strip_c_comments(before)
              if after != before:
                  p.write_text(after, encoding='utf-8', newline='\n')
                  changed += 1
                  print('cleaned', name)

          for name in py_files:
              p = Path(name)
              before = p.read_text(encoding='utf-8')
              after = strip_python_notes(before)
              if after != before:
                  ast.parse(after)
                  p.write_text(after, encoding='utf-8', newline='\n')
                  changed += 1
                  print('cleaned', name)

          if changed < 8:
              raise SystemExit(f'expected broad cleanup, only {changed} files changed')
          print('changed files:', changed)
          PY

          git diff --check
          python -m py_compile \
            tools/fetch_tokenizer.py tools/kvl_doctor.py tools/kvl_memory_plan.py \
            tools/kvl_vl_chat.py tools/kvl_vl_two_turn.py tools/prepare_kimi_vl_q8.py \
            tools/test_long_context_planner.py
          python tools/test_long_context_planner.py
          cmake -S . -B build-clean -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build-clean -j 2
          ./build-clean/kvl_mla_streaming_probe
          ./build-clean/kvl_spec_q8_lab_probe
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/kvl src tools
          git commit -m "style: trim explanatory code comments"
          git push origin HEAD:research/v9-two-turn-vi-chat
