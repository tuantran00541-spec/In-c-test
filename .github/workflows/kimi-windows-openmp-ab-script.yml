name: Windows OpenMP A/B Script

on:
  push:
    branches:
      - research/kimi-msvc-q8-openmp-bench
    paths:
      - 'tools/windows_openmp_ab.ps1'
      - '.github/workflows/kimi-windows-openmp-ab-script.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-script:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content tools/windows_openmp_ab.ps1 -Raw
          [scriptblock]::Create($text) | Out-Null

      - name: Exercise parser with fake frontend under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force fake-model, fake-bin | Out-Null
          Set-Content -Path fake-bin\baseline.exe -Value ''
          Set-Content -Path fake-bin\openmp.exe -Value ''
          @'
          import sys
          print('[kvl] timing first_token=10.000s avg_next=2.000s total=14.000s generated=3', file=sys.stderr)
          print('[kvl] generated ids: 1 2 163586', file=sys.stderr)
          '@ | Set-Content -Path tools\kvl_chat.py -Encoding utf8
          $py = (Get-Command python).Source
          powershell -ExecutionPolicy Bypass -File tools\windows_openmp_ab.ps1 `
            -ModelDir .\fake-model `
            -Python $py `
            -BaselineBinary .\fake-bin\baseline.exe `
            -PilotBinary .\fake-bin\openmp.exe `
            -ThreadList '1,2'
