name: Kimi dynamic expert skip

on:
  workflow_dispatch:
  push:
    branches:
      - research/kimi-vl-dynamic-expert-skip
    paths:
      - "include/kvl/moe_dynamic_skip.h"
      - "src/moe_dynamic_skip.c"
      - "src/dynskip_probe.c"
      - "tools/simulate_kimi_dynskip.py"
      - "tools/run_kimi_dynskip_vl_intelligence.py"
      - "tools/kimi_vl_semantic_score.py"
      - "tools/rescore_kimi_dynskip_vl_intelligence.py"
      - "tests/test_kimi_dynskip_simulator.py"
      - "tests/test_kimi_vl_semantic_score.py"
      - "tests/test_kimi_vl_intelligence_rescore.py"
      - "tests/data/kimi-dynskip-unit.policy"
      - "CMakeLists.txt"
      - ".github/workflows/kimi-dynskip.yml"

permissions:
  contents: read

jobs:
  dynskip-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure portable build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=OFF
      - name: Build dynamic-skip targets
        run: cmake --build build --config Release --parallel 2 --target kvl_dynskip_probe kvl_generate_dynskip kvl_generate_vl_dynskip
      - name: Compile research tooling
        run: |
          python -m py_compile tools/simulate_kimi_dynskip.py
          python -m py_compile tools/run_kimi_dynskip_vl_intelligence.py
          python -m py_compile tools/kimi_vl_semantic_score.py
          python -m py_compile tools/rescore_kimi_dynskip_vl_intelligence.py
          python -m py_compile tests/test_kimi_dynskip_simulator.py
          python -m py_compile tests/test_kimi_vl_semantic_score.py
          python -m py_compile tests/test_kimi_vl_intelligence_rescore.py
      - name: Validate hard VL intelligence suite
        run: python tools/run_kimi_dynskip_vl_intelligence.py --validate-only
      - name: Semantic answer scorer unit test
        run: python tests/test_kimi_vl_semantic_score.py
      - name: Semantic intelligence rescore unit test
        run: python tests/test_kimi_vl_intelligence_rescore.py
      - name: Trace simulator unit test
        run: python tests/test_kimi_dynskip_simulator.py
      - name: Dynamic-skip policy unit test (Linux)
        if: runner.os != 'Windows'
        run: ./build/kvl_dynskip_probe tests/data/kimi-dynskip-unit.policy
      - name: Dynamic-skip policy unit test (Windows)
        if: runner.os == 'Windows'
        run: .\build\Release\kvl_dynskip_probe.exe tests\data\kimi-dynskip-unit.policy
