name: Real Kimi GGUF Q8_0 Windows layer-pin A/B

on:
  push:
    branches:
      - research/kimi-vl-gguf-q8-layerpin
    paths:
      - 'CMakeLists.txt'
      - 'include/kvl/expert_cache.h'
      - 'include/kvl/ops.h'
      - 'src/expert_cache.c'
      - 'src/gguf_q8_moe.c'
      - 'src/cache_layer_pin_probe.c'
      - '.github/workflows/kimi-gguf-q8-windows-layerpin-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-layerpin-ab:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      OFFICIAL_REPO: moonshotai/Kimi-VL-A3B-Instruct
      OFFICIAL_REVISION: 398eede0903cd983a2bfa0cc634e9ac1d843f375
      GGUF_REPO: mradermacher/Kimi-VL-A3B-Instruct-GGUF
      GGUF_REVISION: d645665be0a3028dca3ef3d08dddb51ab23ecf31
      GGUF_FILE: Kimi-VL-A3B-Instruct.Q8_0.gguf
      GGUF_BYTES: '16974941728'
      LLAMA_CPP_GGUF_COMMIT: 5d4a3be26de60093263b2d41ca24c3a49de95cd5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --no-cache-dir huggingface_hub hf_xet safetensors numpy tiktoken transformers jinja2 requests
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "git+https://github.com/ggml-org/llama.cpp.git@$env:LLAMA_CPP_GGUF_COMMIT#subdirectory=gguf-py"

      - name: Build baseline and decode-only layer-pin candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -A x64 -DKVL_USE_AVX2=ON -DKVL_MSVC_PARALLEL_KERNELS=OFF
          cmake --build build --config Release --target kvl_generate_gguf_q8 kvl_generate_gguf_q8_layerpin kvl_cache_layer_pin_probe
          .\build\Release\kvl_cache_layer_pin_probe.exe
          if (-not (Test-Path 'build\Release\kvl_generate_gguf_q8.exe')) { throw 'baseline generator missing' }
          if (-not (Test-Path 'build\Release\kvl_generate_gguf_q8_layerpin.exe')) { throw 'layer-pin generator missing' }

      - name: Fetch tokenizer and pack BF16 trunk once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packed = Join-Path $env:RUNNER_TEMP 'kimi-gguf-q8-runtime'
          $work = Join-Path $env:RUNNER_TEMP 'kimi-official-trunk-source'
          python tools/fetch_tokenizer.py $packed --repo $env:OFFICIAL_REPO --revision $env:OFFICIAL_REVISION
          python tools/pack_full_text.py $work $packed --repo $env:OFFICIAL_REPO --revision $env:OFFICIAL_REVISION --expert-format none
          if (-not (Test-Path (Join-Path $packed 'trunk.bin'))) { throw 'trunk missing' }
          if (Test-Path (Join-Path $packed 'experts.bin')) { throw 'unexpected packed experts' }

      - name: Download pinned full Q8_0 GGUF once and build index
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          packed = Path(os.environ['RUNNER_TEMP']) / 'kimi-gguf-q8-runtime'
          src = Path(hf_hub_download(
              repo_id=os.environ['GGUF_REPO'],
              revision=os.environ['GGUF_REVISION'],
              filename=os.environ['GGUF_FILE'],
              local_dir=packed,
          ))
          dst = packed / 'experts.bin'
          if src.resolve() != dst.resolve():
              src.replace(dst)
          if dst.stat().st_size != int(os.environ['GGUF_BYTES']):
              raise SystemExit(f'GGUF size mismatch: {dst.stat().st_size}')
          '@ | python -
          $packed = Join-Path $env:RUNNER_TEMP 'kimi-gguf-q8-runtime'
          $e = Join-Path $env:RUNNER_TEMP 'kimi-gguf-q8-windows-layerpin-ab'
          New-Item -ItemType Directory -Force -Path $e | Out-Null
          python tools/index_kimi_gguf_q8.py (Join-Path $packed 'experts.bin') (Join-Path $packed 'experts.idx') --summary-json (Join-Path $e 'index-summary.json')

      - name: Prove prefill path is unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packed = Join-Path $env:RUNNER_TEMP 'kimi-gguf-q8-runtime'
          $e = Join-Path $env:RUNNER_TEMP 'kimi-gguf-q8-windows-layerpin-ab'
          $prompt = 'Count from 1 to 20 in order, separated by spaces. Output only the numbers.'
          $base = Join-Path (Get-Location) 'build\Release\kvl_generate_gguf_q8.exe'
          $pin = Join-Path (Get-Location) 'build\Release\kvl_generate_gguf_q8_layerpin.exe'

          python tools/kvl_chat.py $packed $prompt --binary $base --cache-mib 512 --ram-mib 4096 --max-new 1 --temperature 0 --seed 1 --show-tokens 1> (Join-Path $e 'prefill-base.out') 2> (Join-Path $e 'prefill-base.err')
          python tools/kvl_chat.py $packed $prompt --binary $pin --cache-mib 512 --ram-mib 4096 --max-new 1 --temperature 0 --seed 1 --show-tokens 1> (Join-Path $e 'prefill-pin.out') 2> (Join-Path $e 'prefill-pin.err')
          Get-Content (Join-Path $e 'prefill-base.err')
          Get-Content (Join-Path $e 'prefill-pin.err')
          if (Select-String -Path (Join-Path $e 'prefill-pin.err') -Pattern 'kvl_layerpin: activated_after_prefill=yes' -Quiet) { throw 'layer pins activated during prefill-only control' }

      - name: Run balanced long decode A/B
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packed = Join-Path $env:RUNNER_TEMP 'kimi-gguf-q8-runtime'
          $e = Join-Path $env:RUNNER_TEMP 'kimi-gguf-q8-windows-layerpin-ab'
          $prompt = 'Count from 1 to 20 in order, separated by spaces. Output only the numbers.'
          $base = Join-Path (Get-Location) 'build\Release\kvl_generate_gguf_q8.exe'
          $pin = Join-Path (Get-Location) 'build\Release\kvl_generate_gguf_q8_layerpin.exe'

          function Run-One([string]$label, [string]$binary, [bool]$expectPin) {
            $out = Join-Path $e ($label + '.out')
            $err = Join-Path $e ($label + '.err')
            Write-Host "KIMI_LAYERPIN_BEGIN label=$label pin=$expectPin"
            python tools/kvl_chat.py $packed $prompt --binary $binary --cache-mib 512 --ram-mib 4096 --max-new 8 --temperature 0 --seed 1 --show-tokens 1> $out 2> $err
            Get-Content $out
            Get-Content $err
            if (-not (Select-String -Path $err -Pattern 'expert_direct_io=yes' -Quiet)) { throw "$label expert direct I/O missing" }
            if (-not (Select-String -Path $err -Pattern 'trunk_direct_io=yes' -Quiet)) { throw "$label trunk direct I/O missing" }
            $hasPin = Select-String -Path $err -Pattern 'kvl_layerpin: activated_after_prefill=yes' -Quiet
            if ($expectPin -and -not $hasPin) { throw "$label layer-pin activation missing" }
            if (-not $expectPin -and $hasPin) { throw "$label baseline unexpectedly activated pins" }
            Write-Host "KIMI_LAYERPIN_END label=$label pin=$expectPin"
          }

          Run-One 'base_a' $base $false
          Run-One 'pin_a' $pin $true
          Run-One 'pin_b' $pin $true
          Run-One 'base_b' $base $false

      - name: Summarize correctness, I/O and hosted-runner timing
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json, os, re, statistics
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'kimi-gguf-q8-windows-layerpin-ab'
          timing_rx = re.compile(r'\[kvl\] timing first_token=([0-9.]+)s avg_next=([0-9.]+)s total=([0-9.]+)s generated=([0-9]+)')
          ids_rx = re.compile(r'\[kvl\] generated ids:\s*([^\r\n]+)')
          cache_rx = re.compile(
              r'kvl_cache: .*? req=(\d+) hit=(\d+) miss=(\d+) hit_rate=[0-9.]+% evict=(\d+) '
              r'prefetch=(\d+)/(\d+) reads=(\d+) bytes=([0-9.]+) MiB rate=([0-9.]+) MiB/s failures=(\d+)'
          )

          def parse(label):
              ep = root / f'{label}.err'
              op = root / f'{label}.out'
              if not ep.exists() or not op.exists(): return {'missing': True}
              err = ep.read_text(errors='replace')
              out = op.read_text(errors='replace').strip()
              tm = timing_rx.search(err); cm = cache_rx.search(err); im = ids_rx.search(err)
              if not tm or not cm or not im: return {'parse_error': True, 'output': out}
              ids = [int(x) for x in im.group(1).split()]
              return {
                  'output': out,
                  'ids': ids,
                  'direct_io': 'expert_direct_io=yes' in err and 'trunk_direct_io=yes' in err,
                  'layerpin_active': 'kvl_layerpin: activated_after_prefill=yes' in err,
                  'first_token_s': float(tm.group(1)),
                  'avg_next_s': float(tm.group(2)),
                  'total_s': float(tm.group(3)),
                  'generated': int(tm.group(4)),
                  'requests': int(cm.group(1)),
                  'hits': int(cm.group(2)),
                  'misses': int(cm.group(3)),
                  'evictions': int(cm.group(4)),
                  'prefetch_reads': int(cm.group(5)),
                  'prefetch_batches': int(cm.group(6)),
                  'read_ops': int(cm.group(7)),
                  'bytes_mib': float(cm.group(8)),
                  'rate_mib_s': float(cm.group(9)),
                  'failures': int(cm.group(10)),
              }

          pre_b = parse('prefill-base')
          pre_p = parse('prefill-pin')
          labels = ['base_a','pin_a','pin_b','base_b']
          runs = {x: parse(x) for x in labels}
          base = [runs['base_a'], runs['base_b']]
          pin = [runs['pin_a'], runs['pin_b']]

          counter_keys = ['requests','hits','misses','evictions','prefetch_reads','prefetch_batches','read_ops','bytes_mib']
          prefill_equal = all(pre_b.get(k) == pre_p.get(k) for k in counter_keys)
          prefill_token_equal = pre_b.get('ids') == pre_p.get('ids')

          def med(rows, key): return statistics.median(r[key] for r in rows)
          base_reads = med(base, 'prefetch_reads')
          pin_reads = med(pin, 'prefetch_reads')
          base_bytes = med(base, 'bytes_mib')
          pin_bytes = med(pin, 'bytes_mib')
          base_next = med(base, 'avg_next_s')
          pin_next = med(pin, 'avg_next_s')

          seqs = [runs[x].get('ids') for x in labels]
          sequence_exact = all(s == seqs[0] for s in seqs[1:])
          generated_min = min(r.get('generated', 0) for r in runs.values())
          io_effective = pin_reads < base_reads and pin_bytes < base_bytes

          summary = {
              'claim_boundary': 'Windows-2025 hosted-runner real-weight text pilot. Layer pins are disabled throughout layer-major prefill and activate only on the observed L26->L1 transition into autoregressive decode. Same 512 MiB expert cache, direct I/O and AVX2 baseline. Hosted-runner timing is not a target-laptop benchmark or a global speed claim.',
              'policy': {'pins_per_routed_layer': 2, 'routed_layers': 26, 'reserved_pin_slots': 52, 'transient_slots': 6, 'cache_mib': 512},
              'prefill_control': {'baseline': pre_b, 'candidate': pre_p, 'counter_exact': prefill_equal, 'token_exact': prefill_token_equal},
              'runs': runs,
              'sequence_exact_all_long_runs': sequence_exact,
              'generated_min': generated_min,
              'baseline_median_prefetch_reads': base_reads,
              'candidate_median_prefetch_reads': pin_reads,
              'saved_expert_loads_total_run': base_reads - pin_reads,
              'baseline_median_bytes_mib': base_bytes,
              'candidate_median_bytes_mib': pin_bytes,
              'saved_expert_mib_total_run': base_bytes - pin_bytes,
              'expert_bytes_reduction_fraction_total_run': (base_bytes-pin_bytes)/base_bytes if base_bytes else None,
              'baseline_median_avg_next_s': base_next,
              'candidate_median_avg_next_s': pin_next,
              'hosted_runner_next_token_speedup_x': base_next/pin_next if pin_next else None,
              'io_effective': io_effective,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root/'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n')
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          if pre_b.get('missing') or pre_p.get('missing') or pre_b.get('parse_error') or pre_p.get('parse_error'):
              raise SystemExit('prefill control parse failed')
          if not prefill_equal or not prefill_token_equal:
              raise SystemExit('candidate changed prefill behavior')
          if pre_p.get('layerpin_active'):
              raise SystemExit('candidate activated pins during prefill-only control')
          if any(r.get('missing') or r.get('parse_error') for r in runs.values()):
              raise SystemExit('long A/B parse failed')
          if not all(r['direct_io'] and r['failures'] == 0 for r in runs.values()):
              raise SystemExit('direct-I/O/correctness infrastructure gate failed')
          if runs['base_a']['layerpin_active'] or runs['base_b']['layerpin_active']:
              raise SystemExit('baseline activated layer pins')
          if not runs['pin_a']['layerpin_active'] or not runs['pin_b']['layerpin_active']:
              raise SystemExit('candidate did not activate layer pins')
          if not sequence_exact:
              raise SystemExit('layer-pin candidate changed generated token sequence')
          if generated_min < 6:
              raise SystemExit('prompt ended too early for steady decode evidence')
          if not io_effective:
              raise SystemExit('layer-pin candidate did not reduce expert physical loads/bytes')
          '@ | python -

      - name: Upload layer-pin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-gguf-q8-windows-layerpin-ab-evidence
          path: ${{ runner.temp }}/kimi-gguf-q8-windows-layerpin-ab/**
          retention-days: 14
