name: V9 vision tensor map

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v9-vision-map.yml"
      - "tools/fetch_vision_map.py"

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir huggingface_hub
      - run: python tools/fetch_vision_map.py "$RUNNER_TEMP/vision-map"
