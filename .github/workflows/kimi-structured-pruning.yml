name: Kimi structured pruning lab

on:
  push:
    branches:
      - research/kimi-vl-structured-pruning
    paths:
      - "tools/make_router_prune_map.py"
      - "tools/merge_expert_store.py"
      - "tests/test_expert_merge_pruning.py"
      - ".github/workflows/kimi-structured-pruning.yml"
  workflow_dispatch:

jobs:
  synthetic-pruning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Syntax
        run: |
          python -m py_compile tools/make_router_prune_map.py
          python -m py_compile tools/merge_expert_store.py
          python -m py_compile tests/test_expert_merge_pruning.py
      - name: Synthetic structured-pruning roundtrip
        run: python tests/test_expert_merge_pruning.py
