name: Kimi local API contract

on:
  push:
    branches:
      - research/kimi-local-api
    paths:
      - "tools/kvl_api.py"
      - "tools/test_kvl_api_contract.py"
      - ".github/workflows/kimi-local-api-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tokenizer dependency
        run: python -m pip install --disable-pip-version-check tiktoken
      - name: Compile API adapter
        run: python -m py_compile tools/kvl_api.py tools/test_kvl_api_contract.py
      - name: Run HTTP contract tests
        run: python tools/test_kvl_api_contract.py
