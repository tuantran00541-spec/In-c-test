name: Real Kimi-VL V6 full incremental decode

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/real-v6-full-decode.yml"
      - "src/decode_probe.c"
      - "src/mla_compressed_state.c"
      - "include/kvl/mla_compressed_state.h"
      - "src/ops.c"
      - "include/kvl/ops.h"

jobs:
  two-token-full-model:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build and run V6 synthetic gate
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 2
          ./build/kvl_mla_incremental_probe
      - name: Convert complete official text model with bounded source working set
        run: |
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-vl-v6-full" "$RUNNER_TEMP/packed-v6"
          du -h "$RUNNER_TEMP/packed-v6"/*
          df -h /
      - name: Compare two-token full prefill with persistent compressed incremental decode
        run: |
          ./build/kvl_decode_probe \
            "$RUNNER_TEMP/packed-v6/trunk.bin" \
            "$RUNNER_TEMP/packed-v6/trunk.idx" \
            "$RUNNER_TEMP/packed-v6/experts.bin" \
            "$RUNNER_TEMP/packed-v6/experts.idx" \
            536870912
