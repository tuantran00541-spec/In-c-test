name: V9 exact Vietnamese official-media A-B diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v9-user-vi-official-media-ab.yml"
      - "tools/dump_official_bf16_vision_reference.py"

jobs:
  vi-media-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkpoint-compatible dependencies
        run: |
          python -m pip install --no-cache-dir "transformers==4.50.3" huggingface_hub safetensors numpy pillow tiktoken
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build AVX2 V9 runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x ./build/kvl_vision
          test -x ./build/kvl_generate_vl

      - name: Restore exact Vietnamese regression image
        run: |
          base64 -d .github/testdata/kimi-user-vi.jpg.b64 > "$RUNNER_TEMP/user-vi.jpg"

      - name: Fetch runtime frontend assets
        run: |
          python tools/fetch_tokenizer.py "$RUNNER_TEMP/packed-v9"

      - name: Fetch official index and vision shard
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import json, os
          repo='moonshotai/Kimi-VL-A3B-Instruct'
          root=os.path.join(os.environ['RUNNER_TEMP'],'kimi-vl-v9-ab')
          for name in ('config.json','model.safetensors.index.json','preprocessor_config.json'):
              hf_hub_download(repo, filename=name, local_dir=root)
          idx=json.load(open(os.path.join(root,'model.safetensors.index.json')))
          shards=sorted({v for k,v in idx['weight_map'].items() if k.startswith('vision_tower.') or k.startswith('multi_modal_projector.')})
          assert shards, 'no vision shards'
          for name in shards:
              print(hf_hub_download(repo, filename=name, local_dir=root))
          PY
          python tools/pack_vision.py "$RUNNER_TEMP/kimi-vl-v9-ab" "$RUNNER_TEMP/packed-v9"

      - name: Preprocess exact image and produce both media-feature variants
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0,'tools')
          from kimi_image import write_patches
          gh,gw=write_patches(os.path.join(os.environ['RUNNER_TEMP'],'kimi-vl-v9-ab'), os.path.join(os.environ['RUNNER_TEMP'],'user-vi.jpg'), os.path.join(os.environ['RUNNER_TEMP'],'patches.f32'))
          assert (gh,gw)==(14,14), (gh,gw)
          print(f'grid={gh}x{gw} media_tokens={(gh//2)*(gw//2)}')
          PY
          python tools/dump_official_bf16_vision_reference.py \
            "$RUNNER_TEMP/kimi-vl-v9-ab" "$RUNNER_TEMP/patches.f32" 14 14 \
            "$RUNNER_TEMP/official-media.f32" "$RUNNER_TEMP/official-media.u16"
          ./build/kvl_vision \
            "$RUNNER_TEMP/packed-v9/vision.bin" "$RUNNER_TEMP/packed-v9/vision.idx" \
            "$RUNNER_TEMP/patches.f32" 14 14 "$RUNNER_TEMP/c-media.f32"

      - name: Pack complete official text model once
        run: |
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-vl-v9-ab" "$RUNNER_TEMP/packed-v9"
          du -h "$RUNNER_TEMP/packed-v9"/*.bin

      - name: Build exact Vietnamese multimodal prompt IDs
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from kimi_tokenizer import build_encoding, encode_image_chat
          model=Path(os.environ['RUNNER_TEMP'])/'packed-v9'
          enc,_,special=build_encoding(model)
          prompt='Hãy nhìn ảnh này và trả lời hoàn toàn bằng tiếng Việt. Mô tả ngắn gọn nhân vật và biểu cảm trong ảnh trong một câu.'
          ids=encode_image_chat(enc,prompt,49)
          pad=special['<|media_pad|>']
          assert len(ids)==136, len(ids)
          assert sum(x==pad for x in ids)==49
          (Path(os.environ['RUNNER_TEMP'])/'prompt.ids').write_text('\n'.join(map(str,ids))+'\n',encoding='ascii')
          print(f'prompt_tokens={len(ids)} media_tokens={sum(x==pad for x in ids)}')
          PY

      - name: A - C text tower with official BF16 media features
        run: |
          ./build/kvl_generate_vl \
            "$RUNNER_TEMP/packed-v9/trunk.bin" "$RUNNER_TEMP/packed-v9/trunk.idx" \
            "$RUNNER_TEMP/packed-v9/experts.bin" "$RUNNER_TEMP/packed-v9/experts.idx" \
            "$RUNNER_TEMP/prompt.ids" "$RUNNER_TEMP/official-media.f32" \
            536870912 16 0 1 \
            2> >(tee "$RUNNER_TEMP/official-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/official-tokens.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/official-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/official-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/official-stderr.txt"

      - name: B - same C text tower with current C MoonViT features
        run: |
          ./build/kvl_generate_vl \
            "$RUNNER_TEMP/packed-v9/trunk.bin" "$RUNNER_TEMP/packed-v9/trunk.idx" \
            "$RUNNER_TEMP/packed-v9/experts.bin" "$RUNNER_TEMP/packed-v9/experts.idx" \
            "$RUNNER_TEMP/prompt.ids" "$RUNNER_TEMP/c-media.f32" \
            536870912 16 0 1 \
            2> >(tee "$RUNNER_TEMP/c-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/c-tokens.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/c-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/c-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/c-stderr.txt"

      - name: Decode and print A-B outputs
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from kimi_tokenizer import build_encoding, decode_generated
          root=Path(os.environ['RUNNER_TEMP'])
          enc,_,_=build_encoding(root/'packed-v9')
          def read(name):
              ids=[]
              for line in (root/name).read_text().splitlines():
                  if line.startswith('TOKEN '): ids.append(int(line.split()[1]))
              return ids
          for label,name in [('OFFICIAL_BF16_MEDIA','official-tokens.txt'),('C_MEDIA','c-tokens.txt')]:
              ids=read(name)
              text=decode_generated(enc,ids,{163585,163586})
              print(f'===== {label} =====')
              print('ids:', ' '.join(map(str,ids)))
              print(text)
          PY
