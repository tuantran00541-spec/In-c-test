name: V8 Windows portability

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v8-windows.yml"
      - "CMakeLists.txt"
      - "src/expert_store.c"
      - "src/trunk_store.c"
      - "src/expert_cache.c"
      - "src/ops.c"
      - "src/mla_state.c"
      - "src/mla_compressed_state.c"
      - "tests/test_cache_roundtrip.py"
      - "tests/test_stack_oracle.py"
      - "tools/pack_experts.py"
      - "tools/pack_trunk.py"

jobs:
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir safetensors numpy
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Configure and build MSVC Release
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel 2
      - name: Exercise Windows expert direct I/O
        shell: pwsh
        run: |
          python tests/test_cache_roundtrip.py --build-dir build/Release
      - name: Exercise Windows trunk plus expert stores
        shell: pwsh
        run: |
          python tests/test_stack_oracle.py --build-dir build/Release
