name: Real Kimi-VL V9 end-to-end image chat

# Expensive official-weight release gate. Updating this workflow runs it once; afterwards use
# workflow_dispatch so normal source pushes do not repeatedly download/pack ~30 GiB of weights.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/real-v9-end-to-end.yml"

jobs:
  image-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime pack/frontend dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy pillow tiktoken
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build AVX2 V9 runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x ./build/kvl_vision
          test -x ./build/kvl_generate_vl
      - name: Fetch small frontend assets
        run: |
          python tools/fetch_tokenizer.py "$RUNNER_TEMP/packed-v9"
      - name: Fetch vision shard and pack MoonViT store
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import os
          root=os.path.join(os.environ['RUNNER_TEMP'],'kimi-vl-v9-full')
          for name in ('config.json','model.safetensors.index.json','model-00001-of-00007.safetensors'):
              print(hf_hub_download('moonshotai/Kimi-VL-A3B-Instruct', filename=name, local_dir=root))
          PY
          python tools/pack_vision.py "$RUNNER_TEMP/kimi-vl-v9-full" "$RUNNER_TEMP/packed-v9"
      - name: Convert complete official text model with bounded source-shard set
        run: |
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-vl-v9-full" "$RUNNER_TEMP/packed-v9"
          du -h "$RUNNER_TEMP/packed-v9"/*.bin
      - name: Create deterministic 224px red image
        run: |
          python - <<'PY'
          from PIL import Image
          import os
          p=os.path.join(os.environ['RUNNER_TEMP'],'red-224.png')
          Image.new('RGB',(224,224),(255,0,0)).save(p)
          print(p)
          PY
      - name: Run real image to real generated text through C runtime
        run: |
          python tools/kvl_vl_chat.py "$RUNNER_TEMP/packed-v9" "$RUNNER_TEMP/red-224.png" \
            "What is the dominant color in this image? Reply with one short word." \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --cache-mib 512 --ram-mib 4096 --max-new 4 --temperature 0 --seed 1 \
            --show-tokens \
            2> >(tee "$RUNNER_TEMP/v9-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/v9-output.txt"
          test -s "$RUNNER_TEMP/v9-output.txt"
          grep -q 'grid=16x16 media_tokens=64' "$RUNNER_TEMP/v9-stderr.txt"
          grep -q 'kvl_vision: grid=16x16 media_tokens=64 direct_io=yes' "$RUNNER_TEMP/v9-stderr.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/v9-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/v9-stderr.txt"
          grep -q 'kvl_generate_vl: generated=' "$RUNNER_TEMP/v9-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/v9-stderr.txt"
          grep -q 'timing vision=' "$RUNNER_TEMP/v9-stderr.txt"
          grep -Eiq '(^|[^A-Za-z])red([^A-Za-z]|$)' "$RUNNER_TEMP/v9-output.txt"
