name: Real Kimi functional pruning phase C

on:
  workflow_dispatch:
  push:
    branches:
      - research/kimi-vl-functional-pruning
    paths:
      - ".github/workflows/kimi-functional-pruning-phase-c-real.yml"

permissions:
  contents: read

jobs:
  phase-c-real:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
      KIMI_REV: "398eede0903cd983a2bfa0cc634e9ac1d843f375"
      BASE_MASK: "tests/data/kimi-functional-pruning-phase-a-33259183604-adaptive-unseen-cap6.mask"
      CANDIDATE_MANIFEST: "tests/data/kimi-functional-pruning-phase-c-candidates.json"
      MM64: "tests/data/kimi-functional-pruning-phase-c-mm64.mask"
      MM80: "tests/data/kimi-functional-pruning-phase-c-mm80.mask"
      MM96: "tests/data/kimi-functional-pruning-phase-c-mm96.mask"
      SCREEN_CACHE_MIB: "512"
      TEXT_CACHE_MIB: "1536"
      VL_CACHE_MIB: "512"
      RAM_MIB: "4096"

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy pillow tiktoken transformers jinja2
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build AVX2 runtime and validate phase C tooling
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x ./build/kvl_probe
          test -x ./build/kvl_generate
          test -x ./build/kvl_generate_vl
          test -x ./build/kvl_vision
          python tests/test_kimi_pruning_multi_screen.py
          python tools/run_kimi_pruning_multi_screen.py --validate-only \
            --candidate mm64="$MM64" --candidate mm80="$MM80" --candidate mm96="$MM96"
          mkdir -p "$RUNNER_TEMP/phase-c/evidence"

      - name: Validate candidate provenance and nesting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, hashlib, json, os, pathlib

          def read_mask(path):
              out = set()
              for raw in pathlib.Path(path).read_text().splitlines():
                  line = raw.split('#', 1)[0].strip()
                  if not line:
                      continue
                  layer, expert = map(int, line.split())
                  key = (layer, expert)
                  assert 1 <= layer <= 26 and 0 <= expert < 64 and key not in out
                  out.add(key)
              return out

          manifest = json.loads(pathlib.Path(os.environ['CANDIDATE_MANIFEST']).read_text())
          assert manifest['phase'] == 'C' and manifest['schema_version'] == 1
          assert manifest['physical_projection']['projection_only'] is True
          base_path = pathlib.Path(os.environ['BASE_MASK'])
          base = read_mask(base_path)
          assert len(base) == 50
          assert hashlib.sha256(base_path.read_bytes()).hexdigest() == '13ddf32e65c0dad8848fdf4ae299f12b7151a3bcc09145e89a4328c2b241ff6b'
          expected = {
              'mm64': (os.environ['MM64'], 64, '7781c4944bec1ffa125b2feb62a854dea54d56a9d6e730f899ad46a2fefcd0f5'),
              'mm80': (os.environ['MM80'], 80, '725b0aadf865c952a5e35bab9e850d6188375cc5d3a91e763d6854458797debf'),
              'mm96': (os.environ['MM96'], 96, 'b1098ea9a9865903c337950b91188db97b5d92e4b7fa72ab2069ca9d98058baa'),
          }
          masks = {}
          rows = {x['name']: x for x in manifest['candidates']}
          for name, (path_s, count, digest) in expected.items():
              p = pathlib.Path(path_s)
              m = read_mask(p)
              masks[name] = m
              assert len(m) == count and base <= m
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest
              assert rows[name]['disabled_count'] == count and rows[name]['mask_sha256'] == digest
              extras = m - base
              assert all(layer <= 22 for layer, _ in extras)
              per_layer = collections.Counter(layer for layer, _ in m)
              assert max(per_layer.values()) <= 6
          assert masks['mm64'] < masks['mm80'] < masks['mm96']
          print('PHASE_C_CANDIDATE_PROVENANCE_PASS counts=64,80,96 late_new=0 max_per_layer<=6')
          PY
          cp "$CANDIDATE_MANIFEST" "$RUNNER_TEMP/phase-c/evidence/candidate-manifest.json"
          cp "$MM64" "$RUNNER_TEMP/phase-c/evidence/mm64.mask"
          cp "$MM80" "$RUNNER_TEMP/phase-c/evidence/mm80.mask"
          cp "$MM96" "$RUNNER_TEMP/phase-c/evidence/mm96.mask"

      - name: Restore and generate six VL regression images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vl-images"
          base64 -d .github/testdata/kimi-user-vi.jpg.b64 > "$RUNNER_TEMP/vl-images/user-vi.jpg"
          base64 -d .github/testdata/kimi-user-en.jpg.b64 > "$RUNNER_TEMP/vl-images/user-en.jpg"
          python - <<'PY'
          import json, os, pathlib
          from PIL import Image, ImageDraw

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vl-images'
          im = Image.new('RGB', (448, 448), 'white'); d = ImageDraw.Draw(im)
          d.rectangle((40, 55, 190, 205), fill='red'); d.ellipse((245, 55, 395, 205), fill='blue')
          d.polygon([(220, 245), (105, 405), (335, 405)], fill='green'); im.save(root / 'synthetic-shapes.png')
          im = Image.new('RGB', (448, 448), 'white'); d = ImageDraw.Draw(im); cell = 56
          for y in range(8):
              for x in range(8):
                  if (x + y) % 2:
                      d.rectangle((x*cell, y*cell, (x+1)*cell-1, (y+1)*cell-1), fill='black')
          im.save(root / 'synthetic-checker.png')
          im = Image.new('RGB', (448, 448), 'white'); d = ImageDraw.Draw(im)
          for k in range(-448, 896, 80):
              d.line((k, 0, k-448, 448), fill='purple', width=24)
          im.save(root / 'synthetic-diagonal.png')
          im = Image.new('RGB', (448, 448), 'white'); d = ImageDraw.Draw(im)
          for x, y in [(90,90),(220,90),(350,90),(155,260),(285,260)]:
              d.ellipse((x-38,y-38,x+38,y+38), fill='red')
          im.save(root / 'synthetic-count.png')

          suite = json.loads(pathlib.Path('tests/data/kimi-functional-pruning-vl-suite.json').read_text())
          suite['notes'] += ' Phase-C adds two fresh synthetic cases not used to rank the new candidates.'
          suite['cases'].extend([
              {'id':'vl-phase-c-diagonal','image':'synthetic-diagonal.png','max_new':16,
               'prompt':'Describe the dominant line pattern in this image in one short sentence.'},
              {'id':'vl-phase-c-count','image':'synthetic-count.png','max_new':4,
               'prompt':'How many red circles are visible? Reply with only the integer.'},
          ])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phase-c-vl-suite.json'
          out.write_text(json.dumps(suite, indent=2, sort_keys=True) + '\n')
          assert len(suite['cases']) == 6
          print('PHASE_C_VL_SUITE_READY cases=6 fresh=2')
          PY

      - name: Fetch pinned Kimi source metadata and MoonViT shard
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          repo = 'moonshotai/Kimi-VL-A3B-Instruct'
          rev = os.environ['KIMI_REV']
          root = Path(os.environ['RUNNER_TEMP']) / 'kimi-source'
          root.mkdir(parents=True, exist_ok=True)
          for name in ('config.json', 'model.safetensors.index.json', 'model-00001-of-00007.safetensors'):
              p = hf_hub_download(repo_id=repo, revision=rev, filename=name, local_dir=root)
              print(f'PHASE_C_SOURCE {name} -> {p}')
          PY

      - name: Pack pinned MoonViT
        run: |
          python tools/pack_vision.py "$RUNNER_TEMP/kimi-source" "$RUNNER_TEMP/packed"
          test -s "$RUNNER_TEMP/packed/vision.bin"
          test -s "$RUNNER_TEMP/packed/vision.idx"

      - name: Pack official Kimi text with full Q8 routed experts
        run: |
          python tools/fetch_tokenizer.py "$RUNNER_TEMP/packed" --revision "$KIMI_REV"
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-source" "$RUNNER_TEMP/packed" \
            --revision "$KIMI_REV" --expert-format q8
          test -s "$RUNNER_TEMP/packed/trunk.bin"
          test -s "$RUNNER_TEMP/packed/trunk.idx"
          test -s "$RUNNER_TEMP/packed/experts.bin"
          test -s "$RUNNER_TEMP/packed/experts.idx"
          df -h "$RUNNER_TEMP"

      - name: Screen mm64 mm80 mm96 with shared text and VL baselines
        run: |
          python tools/run_kimi_pruning_multi_screen.py \
            --model-dir "$RUNNER_TEMP/packed" \
            --image-root "$RUNNER_TEMP/vl-images" \
            --binary ./build/kvl_generate \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --vl-suite "$RUNNER_TEMP/phase-c-vl-suite.json" \
            --candidate mm64="$MM64" --candidate mm80="$MM80" --candidate mm96="$MM96" \
            --work-dir "$RUNNER_TEMP/phase-c/screen" \
            --cache-mib "$SCREEN_CACHE_MIB" --ram-mib "$RAM_MIB"
          cp "$RUNNER_TEMP/phase-c/screen/multi-screen-summary.json" "$RUNNER_TEMP/phase-c/evidence/multi-screen-summary.json"

      - name: Print phase C screen result
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phase-c/evidence/multi-screen-summary.json'
          r = json.loads(p.read_text())
          for c in r['candidates']:
              t, v = c['text'], c['vl']
              print(
                  f"PHASE_C_SCREEN name={c['name']} disabled={c['disabled_count']} pass={c['screen_pass']} "
                  f"text_exact={t['first_token_exact']}/{t['prompts']} text_js={t['logit_max_js_divergence']:.9g} "
                  f"vl_exact={v['first_token_exact']}/{v['cases']} vl_js={v['logit_max_js_divergence']:.9g} "
                  f"failures={c['screen_failures']}"
              )
          print('PHASE_C_SCREEN_SELECTED', r['selected'])
          assert r['selected'] is not None, 'no Phase-C candidate passed the text+VL next-token screen'
          PY

      - name: Find strongest candidate that also passes text and VL long generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/phase-c/screen-passing.tsv"
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phase-c/evidence/multi-screen-summary.json'
          r = json.loads(p.read_text())
          for c in reversed(r['candidates']):
              if c['screen_pass']:
                  print(c['name'] + '\t' + c['mask'])
          PY
          : > "$RUNNER_TEMP/phase-c/long-attempts.tsv"
          selected=""
          while IFS=$'\t' read -r name mask; do
            test -n "$name" || continue
            echo "PHASE_C_LONG_ATTEMPT $name" | tee -a "$RUNNER_TEMP/phase-c/long-attempts.tsv"
            python tools/run_kimi_pruning_phase_b.py \
              --model-dir "$RUNNER_TEMP/packed" --binary ./build/kvl_generate \
              --mask "$mask" --candidate "$name" \
              --work-dir "$RUNNER_TEMP/phase-c/long/$name/text" \
              --cache-mib "$TEXT_CACHE_MIB" --ram-mib "$RAM_MIB"
            if ! python - "$RUNNER_TEMP/phase-c/long/$name/text/phase-b-summary.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1])); a=r['aggregate']
          ok=a['token_exact_prompts']==a['prompts'] and not a['divergent_prompts']
          print(f"PHASE_C_TEXT_LONG_GATE exact={a['token_exact_prompts']}/{a['prompts']} ok={ok}")
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "PHASE_C_LONG_TEXT_REJECT $name" | tee -a "$RUNNER_TEMP/phase-c/long-attempts.tsv"
              continue
            fi
            python tools/run_kimi_pruning_vl_phase_b.py \
              --model-dir "$RUNNER_TEMP/packed" --image-root "$RUNNER_TEMP/vl-images" \
              --vision-binary ./build/kvl_vision --generate-binary ./build/kvl_generate_vl \
              --suite "$RUNNER_TEMP/phase-c-vl-suite.json" --mask "$mask" \
              --work-dir "$RUNNER_TEMP/phase-c/long/$name/vl" \
              --cache-mib "$VL_CACHE_MIB" --ram-mib "$RAM_MIB"
            if ! python - "$RUNNER_TEMP/phase-c/long/$name/vl/vl-phase-b-summary.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1])); a=r['aggregate']
          ok=a['token_exact_cases']==a['cases'] and not a['divergent_cases']
          print(f"PHASE_C_VL_LONG_GATE exact={a['token_exact_cases']}/{a['cases']} ok={ok}")
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "PHASE_C_LONG_VL_REJECT $name" | tee -a "$RUNNER_TEMP/phase-c/long-attempts.tsv"
              continue
            fi
            selected="$name"
            cp "$mask" "$RUNNER_TEMP/phase-c/final-selected.mask"
            printf '%s\n' "$name" > "$RUNNER_TEMP/phase-c/final-selected-name.txt"
            cp "$RUNNER_TEMP/phase-c/long/$name/text/phase-b-summary.json" "$RUNNER_TEMP/phase-c/evidence/selected-text-long.json"
            cp "$RUNNER_TEMP/phase-c/long/$name/vl/vl-phase-b-summary.json" "$RUNNER_TEMP/phase-c/evidence/selected-vl-long.json"
            echo "PHASE_C_LONG_SELECTED $name" | tee -a "$RUNNER_TEMP/phase-c/long-attempts.tsv"
            break
          done < "$RUNNER_TEMP/phase-c/screen-passing.tsv"
          cp "$RUNNER_TEMP/phase-c/long-attempts.tsv" "$RUNNER_TEMP/phase-c/evidence/long-attempts.tsv"
          test -n "$selected" || { echo 'No candidate passed long-generation text+VL gates'; exit 1; }
          cp "$RUNNER_TEMP/phase-c/final-selected.mask" "$RUNNER_TEMP/phase-c/evidence/final-selected.mask"
          cp "$RUNNER_TEMP/phase-c/final-selected-name.txt" "$RUNNER_TEMP/phase-c/evidence/final-selected-name.txt"

      - name: Compact selected real Q8 expert store and verify retained bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparse"
          python tools/compact_expert_store.py \
            "$RUNNER_TEMP/packed/experts.bin" "$RUNNER_TEMP/packed/experts.idx" \
            "$RUNNER_TEMP/phase-c/final-selected.mask" \
            "$RUNNER_TEMP/sparse/experts.bin" "$RUNNER_TEMP/sparse/experts.idx" \
            --report "$RUNNER_TEMP/phase-c/evidence/compaction.json"
          test -s "$RUNNER_TEMP/sparse/experts.mask"
          cp "$RUNNER_TEMP/sparse/experts.mask" "$RUNNER_TEMP/phase-c/evidence/bound-experts.mask"
          python tools/verify_compact_expert_store.py \
            "$RUNNER_TEMP/packed/experts.bin" "$RUNNER_TEMP/packed/experts.idx" \
            "$RUNNER_TEMP/sparse/experts.bin" "$RUNNER_TEMP/sparse/experts.idx" \
            "$RUNNER_TEMP/phase-c/final-selected.mask" \
            --report "$RUNNER_TEMP/phase-c/evidence/byte-verification.json"
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'phase-c/evidence'
          c=json.loads((root/'compaction.json').read_text()); v=json.loads((root/'byte-verification.json').read_text())
          assert c['source_records']==1664 and c['removed_records'] in (64,80,96)
          assert c['output_records']==1664-c['removed_records']
          assert v['byte_exact'] is True and v['records_verified']==c['output_records']
          assert c['source_bytes']==14428930048
          assert c['output_bytes']==v['sparse_bytes'] and c['byte_reduction']==v['byte_reduction']
          print(f"PHASE_C_PHYSICAL_BYTES_PASS records={c['source_records']}->{c['output_records']} bytes={c['source_bytes']}->{c['output_bytes']} removed={c['byte_reduction']}")
          PY

      - name: Exercise sparse sidecar auto-binding for every selected removed ID
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools')
          from compact_expert_store import read_index, read_mask
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          disabled=sorted(read_mask(temp/'phase-c/final-selected.mask'))
          meta=read_index(temp/'sparse/experts.idx')
          assert len(disabled) in (64,80,96) and all(x not in meta['ids'] for x in disabled)
          env=os.environ.copy(); env.pop('KVL_MOE_MASK', None)
          probe=pathlib.Path('build/kvl_probe').resolve()
          for layer, expert in disabled:
              p=subprocess.run([str(probe),str(temp/'sparse/experts.bin'),str(temp/'sparse/experts.idx'),str(layer),str(expert)],text=True,capture_output=True,env=env)
              assert p.returncode==1 and 'sparse expert store bound mask=' in p.stderr
              assert f'expert L{layer}/E{expert} not present' in p.stderr
          retained=min(meta['ids'])
          p=subprocess.run([str(probe),str(temp/'sparse/experts.bin'),str(temp/'sparse/experts.idx'),str(retained[0]),str(retained[1])],text=True,capture_output=True,env=env)
          assert p.returncode==0 and 'sparse expert store bound mask=' in p.stderr
          report={'removed_ids_checked':len(disabled),'all_removed_absent_via_c_runtime':True,'auto_mask_env_unset':True,'retained_id_checked':list(retained),'retained_load_ok_via_c_runtime':True}
          (temp/'phase-c/evidence/c-sparse-lookup.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(f"PHASE_C_C_AUTO_BIND_PASS removed={len(disabled)} retained={retained}")
          PY

      - name: Prepare representative text and VL equivalence inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-c/equiv-inputs"
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from kimi_image import write_patches
          from kimi_tokenizer import build_encoding, encode_chat, encode_image_chat
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); model=temp/'packed'; prep=temp/'phase-c/equiv-inputs'
          enc,_,_=build_encoding(model)
          text_suite=json.loads(pathlib.Path('tests/data/kimi-functional-pruning-suite.json').read_text())
          item=next(x for x in text_suite['heldout'] if x['id']=='eval-arithmetic-01')
          ids=encode_chat(enc,item['prompt'],'You are a helpful assistant')
          (prep/'text.ids').write_text('\n'.join(map(str,ids))+'\n',encoding='ascii')
          vl_suite=json.loads((temp/'phase-c-vl-suite.json').read_text())
          item=next(x for x in vl_suite['cases'] if x['id']=='vl-user-en-description')
          gh,gw=write_patches(model,temp/'vl-images'/item['image'],prep/'patches.f32')
          media_tokens=(gh//2)*(gw//2)
          ids=encode_image_chat(enc,item['prompt'],media_tokens,'You are a helpful assistant')
          (prep/'vl.ids').write_text('\n'.join(map(str,ids))+'\n',encoding='ascii')
          (prep/'grid.txt').write_text(f'{gh} {gw}\n')
          print(f'PHASE_C_EQUIV_INPUTS text_ready=1 vl_grid={gh}x{gw} media_tokens={media_tokens}')
          PY
          read GH GW < "$RUNNER_TEMP/phase-c/equiv-inputs/grid.txt"
          ./build/kvl_vision \
            "$RUNNER_TEMP/packed/vision.bin" "$RUNNER_TEMP/packed/vision.idx" \
            "$RUNNER_TEMP/phase-c/equiv-inputs/patches.f32" "$GH" "$GW" \
            "$RUNNER_TEMP/phase-c/equiv-inputs/media.bin"
          test -s "$RUNNER_TEMP/phase-c/equiv-inputs/media.bin"

      - name: Verify selected sparse store text runtime equivalence with sidecar auto-mask
        run: |
          python tools/run_kimi_expert_store_equivalence.py \
            --binary ./build/kvl_generate \
            --trunk-bin "$RUNNER_TEMP/packed/trunk.bin" --trunk-idx "$RUNNER_TEMP/packed/trunk.idx" \
            --full-experts-bin "$RUNNER_TEMP/packed/experts.bin" --full-experts-idx "$RUNNER_TEMP/packed/experts.idx" \
            --sparse-experts-bin "$RUNNER_TEMP/sparse/experts.bin" --sparse-experts-idx "$RUNNER_TEMP/sparse/experts.idx" \
            --prompt-ids "$RUNNER_TEMP/phase-c/equiv-inputs/text.ids" \
            --mask "$RUNNER_TEMP/phase-c/final-selected.mask" --sparse-auto-mask \
            --work-dir "$RUNNER_TEMP/phase-c/text-equivalence" --cache-mib 512 --max-new 8
          cp "$RUNNER_TEMP/phase-c/text-equivalence/equivalence.json" "$RUNNER_TEMP/phase-c/evidence/text-runtime-equivalence.json"

      - name: Verify selected sparse store VL runtime equivalence with sidecar auto-mask
        run: |
          python tools/run_kimi_expert_store_equivalence.py \
            --binary ./build/kvl_generate_vl \
            --trunk-bin "$RUNNER_TEMP/packed/trunk.bin" --trunk-idx "$RUNNER_TEMP/packed/trunk.idx" \
            --full-experts-bin "$RUNNER_TEMP/packed/experts.bin" --full-experts-idx "$RUNNER_TEMP/packed/experts.idx" \
            --sparse-experts-bin "$RUNNER_TEMP/sparse/experts.bin" --sparse-experts-idx "$RUNNER_TEMP/sparse/experts.idx" \
            --prompt-ids "$RUNNER_TEMP/phase-c/equiv-inputs/vl.ids" --media "$RUNNER_TEMP/phase-c/equiv-inputs/media.bin" \
            --mask "$RUNNER_TEMP/phase-c/final-selected.mask" --sparse-auto-mask \
            --work-dir "$RUNNER_TEMP/phase-c/vl-equivalence" --cache-mib 512 --max-new 8
          cp "$RUNNER_TEMP/phase-c/vl-equivalence/equivalence.json" "$RUNNER_TEMP/phase-c/evidence/vl-runtime-equivalence.json"

      - name: Write and gate measured phase C result
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); root=temp/'phase-c/evidence'
          screen=json.loads((root/'multi-screen-summary.json').read_text())
          text_long=json.loads((root/'selected-text-long.json').read_text())
          vl_long=json.loads((root/'selected-vl-long.json').read_text())
          comp=json.loads((root/'compaction.json').read_text())
          verify=json.loads((root/'byte-verification.json').read_text())
          cprobe=json.loads((root/'c-sparse-lookup.json').read_text())
          teq=json.loads((root/'text-runtime-equivalence.json').read_text())
          veq=json.loads((root/'vl-runtime-equivalence.json').read_text())
          name=(root/'final-selected-name.txt').read_text().strip(); mask=root/'final-selected.mask'
          def eq_ok(r):
              return r['sparse_auto_mask'] is True and all(r['checks'][k]['byte_exact'] for k in ('tokens','route','logits')) and r['sparse']['mask_mode']=='sparse-sidecar-auto'
          assert text_long['aggregate']['token_exact_prompts']==text_long['aggregate']['prompts']==14
          assert text_long['aggregate']['divergent_prompts']==[]
          assert vl_long['aggregate']['token_exact_cases']==vl_long['aggregate']['cases']==6
          assert vl_long['aggregate']['divergent_cases']==[]
          assert verify['byte_exact'] is True
          assert cprobe['all_removed_absent_via_c_runtime'] is True and cprobe['auto_mask_env_unset'] is True
          assert eq_ok(teq) and eq_ok(veq)
          result={
              'schema_version':1,
              'workflow_head_sha':os.environ['GITHUB_SHA'],
              'kvl_model_revision':os.environ['KIMI_REV'],
              'selected_candidate':name,
              'selected_mask_sha256':hashlib.sha256(mask.read_bytes()).hexdigest(),
              'disabled_records':comp['removed_records'],
              'source_records':comp['source_records'],
              'sparse_records':comp['output_records'],
              'source_bytes':comp['source_bytes'],
              'sparse_bytes':comp['output_bytes'],
              'byte_reduction':comp['byte_reduction'],
              'byte_reduction_fraction':comp['byte_reduction_fraction'],
              'text_long_exact_prompts':14,
              'vl_long_exact_cases':6,
              'sparse_text_byte_exact':True,
              'sparse_vl_byte_exact':True,
              'sparse_auto_mask':True,
              'eligible_for_phase_c_physical_pruning':True,
              'claim_boundary':'tested deterministic text/VL regression and physical same-mask equivalence only; not a global quality or speed claim',
          }
          (root/'phase-c-summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('PHASE_C_FINAL_PASS ' + json.dumps(result, sort_keys=True))
          PY

