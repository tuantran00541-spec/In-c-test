name: Real Kimi-VL V9 user two-image runtime acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/real-v9-user-two-images.yml"

jobs:
  two-image-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REV: "398eede0903cd983a2bfa0cc634e9ac1d843f375"
      REPO: "moonshotai/Kimi-VL-A3B-Instruct"
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy pillow tiktoken
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build V9 runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x ./build/kvl_vision
          test -x ./build/kvl_generate_vl

      - name: Restore the two user images
        run: |
          base64 -d .github/testdata/kimi-user-vi.jpg.b64 > "$RUNNER_TEMP/user-vi.jpg"
          base64 -d .github/testdata/kimi-user-en.jpg.b64 > "$RUNNER_TEMP/user-en.jpg"
          python - <<'PY'
          from PIL import Image
          import os
          for n in ('user-vi.jpg','user-en.jpg'):
              p=os.path.join(os.environ['RUNNER_TEMP'],n)
              im=Image.open(p)
              print(n, im.size, im.mode)
          PY

      - name: Fetch pinned runtime assets and checkpoint index
        run: |
          python - <<'PY'
          import os,shutil
          from huggingface_hub import hf_hub_download
          repo=os.environ['REPO']; rev=os.environ['REV']
          root=os.path.join(os.environ['RUNNER_TEMP'],'kimi-vl-v9-user')
          packed=os.path.join(os.environ['RUNNER_TEMP'],'packed-v9')
          os.makedirs(root,exist_ok=True); os.makedirs(packed,exist_ok=True)
          for name in ('tiktoken.model','tokenizer_config.json','generation_config.json','chat_template.jinja','preprocessor_config.json'):
              p=hf_hub_download(repo,revision=rev,filename=name,local_dir=root)
              shutil.copy2(p,os.path.join(packed,name))
          for name in ('config.json','model.safetensors.index.json','model-00001-of-00007.safetensors'):
              print(hf_hub_download(repo,revision=rev,filename=name,local_dir=root))
          PY

      - name: Pack pinned MoonViT and complete text checkpoint once
        run: |
          python tools/pack_vision.py "$RUNNER_TEMP/kimi-vl-v9-user" "$RUNNER_TEMP/packed-v9"
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-vl-v9-user" "$RUNNER_TEMP/packed-v9" --revision "$REV"
          du -h "$RUNNER_TEMP/packed-v9"/*.bin

      - name: Test image 1 with Vietnamese prompt
        run: |
          echo '=== VIETNAMESE IMAGE-CONDITIONING TEST ==='
          python tools/kvl_vl_chat.py "$RUNNER_TEMP/packed-v9" "$RUNNER_TEMP/user-vi.jpg" \
            "Hãy mô tả nhân vật và biểu cảm trong hình bằng tiếng Việt, một câu ngắn." \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --cache-mib 512 --ram-mib 4096 --max-new 24 --temperature 0 --seed 1 \
            --show-tokens \
            2> >(tee "$RUNNER_TEMP/vi-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/vi-output.txt"
          test -s "$RUNNER_TEMP/vi-output.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/vi-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/vi-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/vi-stderr.txt"
          grep -q '\[kvl-vl\] token=45 ' "$RUNNER_TEMP/vi-stderr.txt"
          if grep -Eqi 'chưa (được )?cung|không (có|thấy).*ảnh|không.*hình ảnh' "$RUNNER_TEMP/vi-output.txt"; then
            echo 'Vietnamese output fell into missing-image semantics' >&2
            exit 1
          fi

      - name: Test image 2 with English prompt
        run: |
          echo '=== ENGLISH IMAGE-CONDITIONING TEST ==='
          python tools/kvl_vl_chat.py "$RUNNER_TEMP/packed-v9" "$RUNNER_TEMP/user-en.jpg" \
            "Look at this image and answer only in English. Describe the character and facial expression in one short sentence." \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --cache-mib 512 --ram-mib 4096 --max-new 16 --temperature 0 --seed 1 \
            --show-tokens \
            2> >(tee "$RUNNER_TEMP/en-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/en-output.txt"
          test -s "$RUNNER_TEMP/en-output.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/en-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/en-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/en-stderr.txt"
          if grep -Eqi 'not (been )?provided|no image|cannot see (the )?image|image.*missing' "$RUNNER_TEMP/en-output.txt"; then
            echo 'English output fell into missing-image semantics' >&2
            exit 1
          fi

      - name: Print final outputs
        run: |
          echo '===== VI OUTPUT ====='
          cat "$RUNNER_TEMP/vi-output.txt"
          echo
          grep 'generated ids:' "$RUNNER_TEMP/vi-stderr.txt" || true
          echo
          echo '===== EN OUTPUT ====='
          cat "$RUNNER_TEMP/en-output.txt"
          echo
          grep 'generated ids:' "$RUNNER_TEMP/en-stderr.txt" || true
          echo
          echo 'NOTE: this workflow gates multimodal runtime/image conditioning, not model-level semantic quality across languages.'
