name: Real Kimi-VL V8 fast text runtime

# Expensive full-checkpoint performance/correctness baseline. Creating/updating this workflow
# runs it once; afterwards invoke manually.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/real-v8-fast.yml"

jobs:
  fast-text:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy tiktoken transformers jinja2
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build AVX2 runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          ./build/kvl_mla_incremental_probe
      - name: Fetch and verify tokenizer
        run: |
          python tools/fetch_tokenizer.py "$RUNNER_TEMP/packed-v8"
          python tests/test_tokenizer_oracle.py "$RUNNER_TEMP/packed-v8"
      - name: Convert complete official text model
        run: |
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-vl-v8-full" "$RUNNER_TEMP/packed-v8"
      - name: Generate and time real text
        run: |
          python tools/kvl_chat.py "$RUNNER_TEMP/packed-v8" \
            "Reply with exactly one short word: hello" \
            --binary ./build/kvl_generate \
            --cache-mib 512 --ram-mib 4096 --max-new 6 --temperature 0 --seed 1 \
            --show-tokens 2> >(tee "$RUNNER_TEMP/v8-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/v8-output.txt"
          grep -q '^Hello' "$RUNNER_TEMP/v8-output.txt"
          grep -q 'RAM plan=' "$RUNNER_TEMP/v8-stderr.txt"
          grep -q 'timing first_token=' "$RUNNER_TEMP/v8-stderr.txt"
