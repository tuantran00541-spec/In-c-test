name: Kimi MoE multi-signal profiler

on:
  workflow_dispatch:
  push:
    branches:
      - research/kimi-vl-reap-vl
    paths:
      - "CMakeLists.txt"
      - "src/q8_ops.c"
      - "tools/analyze_kimi_moe_profile.py"
      - "tools/kimi_moe_token_profile.py"
      - "tools/analyze_kimi_reap_vl.py"
      - "tools/compare_kimi_logits.py"
      - "tests/test_kimi_moe_profile.py"
      - "tests/test_kimi_moe_token_profile.py"
      - "tests/test_kimi_distribution_overlap.py"
      - "tests/test_kimi_reap_vl.py"
      - "spec/KIMI_MOE_MULTISIGNAL_PROFILE.md"
      - ".github/workflows/kimi-moe-profile.yml"

permissions:
  contents: read

jobs:
  build-and-profile-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable native runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=OFF
          cmake --build build --config Release --parallel 2
      - name: Compile profiler tools
        run: |
          python -m py_compile tools/analyze_kimi_moe_profile.py
          python -m py_compile tools/kimi_moe_token_profile.py
          python -m py_compile tools/analyze_kimi_reap_vl.py
          python -m py_compile tools/compare_kimi_logits.py
      - name: Multi-signal profiler unit test
        run: python tests/test_kimi_moe_profile.py
      - name: Token-aware profiler unit test
        run: python tests/test_kimi_moe_token_profile.py
      - name: Distribution-overlap unit test
        run: python tests/test_kimi_distribution_overlap.py
      - name: Legacy REAP analyzer compatibility test
        run: python tests/test_kimi_reap_vl.py
