name: V9 observable-feature VI grounding diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - debug/v9-strict-bf16-text
    paths:
      - ".github/workflows/v9-user-cross-language-diagnostic.yml"

jobs:
  vi-observable-full-c:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REV: "398eede0903cd983a2bfa0cc634e9ac1d843f375"
      REPO: "moonshotai/Kimi-VL-A3B-Instruct"
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy pillow tiktoken
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build V9 runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x ./build/kvl_vision
          test -x ./build/kvl_generate_vl

      - name: Restore exact VI image
        run: |
          base64 -d .github/testdata/kimi-user-vi.jpg.b64 > "$RUNNER_TEMP/user-vi.jpg"

      - name: Fetch pinned runtime frontend assets
        run: |
          python - <<'PY'
          import os,shutil
          from huggingface_hub import hf_hub_download
          repo=os.environ['REPO']; rev=os.environ['REV']
          dst=os.path.join(os.environ['RUNNER_TEMP'],'packed-v9')
          root=os.path.join(os.environ['RUNNER_TEMP'],'kimi-vl-v9-observable')
          os.makedirs(dst,exist_ok=True); os.makedirs(root,exist_ok=True)
          for name in ('tiktoken.model','tokenizer_config.json','generation_config.json','chat_template.jinja','preprocessor_config.json'):
              p=hf_hub_download(repo,revision=rev,filename=name,local_dir=root)
              shutil.copy2(p,os.path.join(dst,name))
          for name in ('config.json','model.safetensors.index.json','model-00001-of-00007.safetensors'):
              print(hf_hub_download(repo,revision=rev,filename=name,local_dir=root))
          PY

      - name: Pack pinned vision and complete text checkpoint
        run: |
          python tools/pack_vision.py "$RUNNER_TEMP/kimi-vl-v9-observable" "$RUNNER_TEMP/packed-v9"
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-vl-v9-observable" "$RUNNER_TEMP/packed-v9" --revision "$REV"
          du -h "$RUNNER_TEMP/packed-v9"/*.bin

      - name: Full C greedy generation with observable-feature VI prompt
        run: |
          python tools/kvl_vl_chat.py "$RUNNER_TEMP/packed-v9" "$RUNNER_TEMP/user-vi.jpg" \
            "Quan sát khuôn mặt nhân vật trong hình. Hãy mô tả bằng tiếng Việt các đặc điểm nhìn thấy ở mắt, lông mày và miệng trong một câu ngắn; không suy đoán cảm xúc." \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --cache-mib 512 --ram-mib 4096 --max-new 28 --temperature 0 --seed 1 \
            --show-tokens \
            2> >(tee "$RUNNER_TEMP/vi-observable-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/vi-observable-output.txt"
          test -s "$RUNNER_TEMP/vi-observable-output.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/vi-observable-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/vi-observable-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/vi-observable-stderr.txt"
          if grep -Eqi 'chưa (được )?cung|không (có|thấy).*ảnh|không.*hình ảnh' "$RUNNER_TEMP/vi-observable-output.txt"; then
            echo 'observable VI prompt fell into missing-image semantics' >&2
            exit 1
          fi

      - name: Print observable VI result
        run: |
          echo '===== VI OBSERVABLE OUTPUT ====='
          cat "$RUNNER_TEMP/vi-observable-output.txt"
          echo
          echo '===== GENERATED IDS ====='
          grep 'generated ids:' "$RUNNER_TEMP/vi-observable-stderr.txt" || true
