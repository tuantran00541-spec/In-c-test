name: V9 user image-language cross diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v9-user-cross-language-diagnostic.yml"

jobs:
  cross-language:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors numpy pillow tiktoken
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build V9 runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build -j 2
          test -x ./build/kvl_vision
          test -x ./build/kvl_generate_vl

      - name: Restore exact user images
        run: |
          base64 -d .github/testdata/kimi-user-vi.jpg.b64 > "$RUNNER_TEMP/user-vi.jpg"
          base64 -d .github/testdata/kimi-user-en.jpg.b64 > "$RUNNER_TEMP/user-en.jpg"

      - name: Fetch runtime assets
        run: |
          python tools/fetch_tokenizer.py "$RUNNER_TEMP/packed-v9"

      - name: Fetch and pack complete official checkpoint
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import os
          root=os.path.join(os.environ['RUNNER_TEMP'],'kimi-vl-v9-cross')
          for name in ('config.json','model.safetensors.index.json','model-00001-of-00007.safetensors'):
              print(hf_hub_download('moonshotai/Kimi-VL-A3B-Instruct', filename=name, local_dir=root))
          PY
          python tools/pack_vision.py "$RUNNER_TEMP/kimi-vl-v9-cross" "$RUNNER_TEMP/packed-v9"
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi-vl-v9-cross" "$RUNNER_TEMP/packed-v9"
          du -h "$RUNNER_TEMP/packed-v9"/*.bin

      - name: Image 1 with exact English prompt
        run: |
          echo '=== IMAGE1 + ENGLISH PROMPT ==='
          python tools/kvl_vl_chat.py "$RUNNER_TEMP/packed-v9" "$RUNNER_TEMP/user-vi.jpg" \
            "Look at this image and answer only in English. Describe the character and facial expression in one short sentence." \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --cache-mib 512 --ram-mib 4096 --max-new 16 --temperature 0 --seed 1 \
            --show-tokens \
            2> >(tee "$RUNNER_TEMP/image1-en-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/image1-en-output.txt"
          test -s "$RUNNER_TEMP/image1-en-output.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/image1-en-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/image1-en-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/image1-en-stderr.txt"

      - name: Image 2 with exact Vietnamese prompt
        run: |
          echo '=== IMAGE2 + VIETNAMESE PROMPT ==='
          python tools/kvl_vl_chat.py "$RUNNER_TEMP/packed-v9" "$RUNNER_TEMP/user-en.jpg" \
            "Hãy nhìn ảnh này và trả lời hoàn toàn bằng tiếng Việt. Mô tả ngắn gọn nhân vật và biểu cảm trong ảnh trong một câu." \
            --vision-binary ./build/kvl_vision \
            --generate-binary ./build/kvl_generate_vl \
            --cache-mib 512 --ram-mib 4096 --max-new 16 --temperature 0 --seed 1 \
            --show-tokens \
            2> >(tee "$RUNNER_TEMP/image2-vi-stderr.txt" >&2) \
            | tee "$RUNNER_TEMP/image2-vi-output.txt"
          test -s "$RUNNER_TEMP/image2-vi-output.txt"
          grep -q 'prefill=batch-layer-major-media' "$RUNNER_TEMP/image2-vi-stderr.txt"
          grep -q 'media_boundary=bf16' "$RUNNER_TEMP/image2-vi-stderr.txt"
          grep -q 'trunk_direct_io=yes expert_direct_io=yes' "$RUNNER_TEMP/image2-vi-stderr.txt"

      - name: Print crossed outputs
        run: |
          echo '===== IMAGE1 + EN ====='
          cat "$RUNNER_TEMP/image1-en-output.txt"
          echo
          echo '===== IMAGE2 + VI ====='
          cat "$RUNNER_TEMP/image2-vi-output.txt"
          echo
