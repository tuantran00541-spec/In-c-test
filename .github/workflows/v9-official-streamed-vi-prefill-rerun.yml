name: V9 official VI prompt-semantics sweep

on:
  push:
    branches:
      - debug/v9-strict-bf16-text
    paths:
      - ".github/workflows/v9-official-streamed-vi-prefill-rerun.yml"
  workflow_dispatch:

jobs:
  official-vi-prompt-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REV: "398eede0903cd983a2bfa0cc634e9ac1d843f375"
      REPO: "moonshotai/Kimi-VL-A3B-Instruct"
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir "transformers==4.50.3" huggingface_hub safetensors numpy pillow tiktoken
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Restore VI image and fetch pinned frontend and vision assets
        run: |
          base64 -d .github/testdata/kimi-user-vi.jpg.b64 > "$RUNNER_TEMP/user-vi.jpg"
          python - <<'PY'
          import json,os,shutil
          from huggingface_hub import hf_hub_download
          repo=os.environ['REPO']; rev=os.environ['REV']
          work=os.path.join(os.environ['RUNNER_TEMP'],'kimi')
          packed=os.path.join(os.environ['RUNNER_TEMP'],'packed')
          os.makedirs(work,exist_ok=True); os.makedirs(packed,exist_ok=True)
          for n in ('config.json','preprocessor_config.json','model.safetensors.index.json'):
              hf_hub_download(repo,revision=rev,filename=n,local_dir=work)
          for n in ('tiktoken.model','tokenizer_config.json','generation_config.json','chat_template.jinja','preprocessor_config.json'):
              p=hf_hub_download(repo,revision=rev,filename=n,local_dir=work)
              shutil.copy2(p,os.path.join(packed,n))
          idx=json.load(open(os.path.join(work,'model.safetensors.index.json')))
          for n in sorted({v for k,v in idx['weight_map'].items() if k.startswith('vision_tower.') or k.startswith('multi_modal_projector.')}):
              hf_hub_download(repo,revision=rev,filename=n,local_dir=work)
          PY

      - name: Produce exact pinned official BF16 media
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'tools')
          from kimi_image import write_patches
          root=os.path.join(os.environ['RUNNER_TEMP'],'kimi')
          gh,gw=write_patches(root,os.path.join(os.environ['RUNNER_TEMP'],'user-vi.jpg'),os.path.join(os.environ['RUNNER_TEMP'],'patches.f32'))
          assert (gh,gw)==(14,14),(gh,gw)
          PY
          python tools/dump_official_bf16_vision_reference.py \
            "$RUNNER_TEMP/kimi" "$RUNNER_TEMP/patches.f32" 14 14 \
            "$RUNNER_TEMP/media.f32" "$RUNNER_TEMP/media.u16" \
            --revision "$REV"

      - name: Pack pinned complete text model once
        run: |
          python tools/pack_full_text.py "$RUNNER_TEMP/kimi" "$RUNNER_TEMP/packed" --revision "$REV"

      - name: Build prompt sweep and known-bad prefix
        run: |
          python - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from kimi_tokenizer import build_encoding,encode_image_chat

          root=Path(os.environ['RUNNER_TEMP'])/'packed'
          out=Path(os.environ['RUNNER_TEMP'])
          enc,_,special=build_encoding(root)
          prompts={
            'baseline': 'Hãy nhìn ảnh này và trả lời hoàn toàn bằng tiếng Việt. Mô tả ngắn gọn nhân vật và biểu cảm trong ảnh trong một câu.',
            'vi-short': 'Mô tả ảnh này bằng một câu tiếng Việt.',
            'vi-direct': 'Ảnh này có gì? Mô tả nhân vật và biểu cảm bằng một câu tiếng Việt.',
            'vi-natural': 'Hãy mô tả nhân vật và biểu cảm trong hình bằng tiếng Việt, một câu ngắn.',
            'hybrid-en-task-vi-answer': 'Describe the character and facial expression in this image in one short sentence. Answer in Vietnamese.',
            'english-control': 'Look at this image and answer only in English. Describe the character and facial expression in one short sentence.',
          }
          for name,prompt in prompts.items():
              ids=encode_image_chat(enc,prompt,49)
              assert sum(x==special['<|media_pad|>'] for x in ids)==49
              (out/f'{name}.ids').write_text('\n'.join(map(str,ids))+'\n',encoding='ascii')
              print(f'{name}: seq={len(ids)} prompt={prompt!r}')
          bad=[39,150340,13271,118,96,42955,437,16032]
          (out/'bad8.ids').write_text('\n'.join(map(str,bad))+'\n',encoding='ascii')
          print('BAD8_TEXT=',repr(enc.decode(bad)))
          PY

      - name: Score known-bad attractor under each prompt
        run: |
          set -euo pipefail
          for name in baseline vi-short vi-direct vi-natural hybrid-en-task-vi-answer english-control; do
            echo "===== $name ====="
            python tools/dump_official_teacher_forced_bad_prefix.py \
              "$RUNNER_TEMP/packed" "$RUNNER_TEMP/$name.ids" "$RUNNER_TEMP/media.u16" "$RUNNER_TEMP/bad8.ids" \
              --revision "$REV" | tee "$RUNNER_TEMP/$name.log"
            grep -q '^FIRST_DIVERGENCE=' "$RUNNER_TEMP/$name.log"
          done

      - name: Summarize escape points
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          names=['baseline','vi-short','vi-direct','vi-natural','hybrid-en-task-vi-answer','english-control']
          for name in names:
              s=(root/f'{name}.log').read_text()
              div=int(re.search(r'^FIRST_DIVERGENCE=(-?\d+)',s,re.M).group(1))
              greedy=re.search(r'^OFFICIAL_GREEDY_IDS=(.*)$',s,re.M).group(1)
              flags=re.search(r'^MATCH_FLAGS=(.*)$',s,re.M).group(1)
              detail=re.search(r'^DIVERGENCE_DETAIL (.*)$',s,re.M)
              print(f'SWEEP {name}: first_divergence={div} greedy={greedy} flags={flags}')
              if detail: print(f'  {detail.group(1)}')
          PY
