name: V9 long-context synthetic gates

on:
  push:
    branches:
      - research/v9-long-context
      - research/v9-long-context-parallel-prefill
      - research/v9-two-turn-vi-chat
      - feature/kimi-trunk-cache-auto
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: User helper Python syntax
        run: |
          python3 -m py_compile \
            tools/prepare_kimi_vl_q8.py \
            tools/fetch_tokenizer.py \
            tools/kvl_doctor.py \
            tools/kvl_memory_plan.py \
            tools/kvl_vl_chat.py \
            tools/kvl_vl_two_turn.py \
            tools/kvl_chat.py
      - name: Planner 8k 16k 32k gates
        run: python3 tools/test_long_context_planner.py
      - name: Build scalar
        run: |
          cmake -S . -B build-scalar -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=OFF
          cmake --build build-scalar --config Release -j 2
      - name: Scalar streaming-vs-materialized oracle
        run: ./build-scalar/kvl_mla_streaming_probe
      - name: Scalar speculative block plus Q8 MLA lab gate
        run: ./build-scalar/kvl_spec_q8_lab_probe
      - name: Build AVX2
        run: |
          cmake -S . -B build-avx2 -DCMAKE_BUILD_TYPE=Release -DKVL_USE_AVX2=ON
          cmake --build build-avx2 --config Release -j 2
      - name: AVX2 streaming-vs-materialized oracle
        run: ./build-avx2/kvl_mla_streaming_probe
      - name: AVX2 speculative block plus Q8 MLA lab gate
        run: ./build-avx2/kvl_spec_q8_lab_probe

  windows-msvc:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: User helper syntax
        shell: pwsh
        run: |
          py -3 -m py_compile tools/prepare_kimi_vl_q8.py tools/fetch_tokenizer.py tools/kvl_doctor.py tools/kvl_memory_plan.py tools/kvl_vl_chat.py tools/kvl_vl_two_turn.py tools/kvl_chat.py
          $text = Get-Content -Raw tools/windows_setup_q8.ps1
          [void][scriptblock]::Create($text)
      - name: Planner 8k 16k 32k gates
        shell: pwsh
        run: py -3 tools/test_long_context_planner.py
      - name: Build MSVC AVX2
        shell: pwsh
        run: |
          cmake -S . -B build -DKVL_USE_AVX2=ON
          cmake --build build --config Release
      - name: MSVC streaming-vs-materialized oracle
        shell: pwsh
        run: .\build\Release\kvl_mla_streaming_probe.exe
      - name: MSVC speculative block plus Q8 MLA lab gate
        shell: pwsh
        run: .\build\Release\kvl_spec_q8_lab_probe.exe
